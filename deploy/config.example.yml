management:
  http_address: "127.0.0.1:8080"
  grpc_address: "127.0.0.1:8081"

host:
  # Set this to an absolute path on the volume that stores your Node data or logs.
  storage_path: "/"

# Optional single Xray instance. Put your Xray v26.11.9 JSON beside config.yml.
# Node installs a private API listener for readiness while loading the config.
# xray:
#   id: "primary"
#   executable: "/node-xray" # Use ./node-xray for a native install beside config.yml.
#   config_file: "xray.json"
#   runtime_directory: "/tmp"
#   # Optional private directory for confirmed account sync recovery across Node restarts.
#   # Create it before use with mode 0700 and ownership matching the Node process.
#   state_directory: "/var/lib/papiliovpn/xray"
#   reset_engine_stats: true
# For one-call scoped resets, set executable to "/node-xray" and enable:
#   native_scope_reset: true

# Optional WireGuard status for an interface in Node's Linux network namespace.
# wireguard:
#   interface: "wg0"
#   managed: true # Optional lifecycle API. Requires CAP_NET_ADMIN.
#   state_directory: "/var/lib/papiliovpn/wireguard" # Optional recovery. Existing Node-owned directory, mode 0700.
