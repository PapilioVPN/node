# Set this Node's identity and supply your own server certificate/key and client CA.
node:
  id: ""
runtime:
  startup_timeout: 10s
  shutdown_timeout: 10s
# Every declared instance starts with Node. Paths resolve against this YAML file.
# Supply the executable and native config yourself, including inside containers.
instances: []
#  - id: edge-a
#    engine: xray
#    xray:
#      binary: ""
#      config_file: ""
#      stop_timeout: 5s
#      # Optional reads of this executable's version/build, independent of readiness.
#      inspection:
#        timeout: 1s
#        max_output_bytes: 1024
#        max_concurrent: 1
#      # Optional native API reads; enable StatsService in Xray's own config.
#      # Unix address resolves against this YAML. For TCP use a loopback IP:port.
#      api:
#        network: unix
#        address: xray-api.sock
#        request_timeout: 2s
#        max_receive_bytes: 4096
#        max_concurrent: 4
#    # Optional candidate building. Create/mount work_dir before enabling it.
#    validation:
#      work_dir: validation-work
#      timeout: 3s
#      max_bytes: 32768
#      max_concurrent: 1
communications:
  grpc:
    enabled: true
    listen: "0.0.0.0:9443"
    request_timeout: 5s
    connection_timeout: 5s
    max_receive_bytes: 65536
    max_concurrent_streams: 64 # Per HTTP/2 connection.
    permissions:
      # Opt in to status reads of all instances by every trusted mTLS client.
      # This grants no engine mutation operations.
      read_instance_status: false
      # Opt in separately to Start/Stop of all configured instances.
      control_instances: false
      # Separate opt-in to bounded candidate building; never applies a config.
      validate_instance_config: false
      # Separate opt-in to configured engine binary/runtime information.
      read_engine_info: false
      # Single, pair and collection traffic reads; independent of runtime/binary info.
      read_engine_stats: false
      # Single/pair/scope reset; a lost reply can hide partial or complete effects.
      reset_engine_stats: false
      # Live inbound user changes; no config persistence or implicit read grants.
      manage_engine_users: false
      # Native inbound membership counts; independent of user changes and online reads.
      read_engine_users: false
      # Online user identities, distinct-IP counts and IP lists; independent of traffic.
      read_engine_online: false
      # Ordered rule references and balancer observations; no probes or changes.
      read_engine_routing: false
    tls:
      certificate_file: ""
      private_key_file: ""
      client_ca_file: ""

  # Optional additional listener. Paths resolve against this YAML file.
  http:
    enabled: false
    listen: "0.0.0.0:9444"
    request_timeout: 5s
    read_timeout: 10s
    write_timeout: 10s
    idle_timeout: 30s
    max_body_bytes: 65536
    max_header_bytes: 16384
    max_concurrent: 64
    max_connections: 256
    tls:
      certificate_file: ""
      private_key_file: ""
      client_ca_file: ""

  # Core request/reply. Provision broker mTLS and restrictive per-node subject ACLs.
  # Node does not see the original publisher certificate across the broker.
  nats:
    enabled: false
    url: "" # tls://broker-host:port; no URL credentials or plaintext fallback.
    subject_prefix: "" # Unique to this Node, e.g. papilio.edge_a.v1.
    queue_group: "" # One logical responder group for this Node's subjects.
    request_timeout: 5s
    connect_timeout: 5s
    drain_timeout: 10s
    max_request_bytes: 65536
    max_response_bytes: 1048576
    max_pending_messages: 64 # Per operation; overflow can cause request timeouts.
    max_pending_bytes: 4194304
    # Set broker max_payload as well: client limits do not cap broker allocation.
    tls:
      certificate_file: ""
      private_key_file: ""
      ca_file: ""
