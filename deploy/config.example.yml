startup_timeout: 10s
shutdown_timeout: 20s
communications:
  http:
    address: 127.0.0.1:8443
    tls:
      certificate: certs/node.crt
      private_key: certs/node.key
      ca: certs/clients-ca.crt
    read_timeout: 5s
    write_timeout: 10s
    idle_timeout: 30s
    shutdown_timeout: 10s
    body_limit: 1048576
    concurrency: 1024
  grpc:
    address: 127.0.0.1:8444
    tls:
      certificate: certs/node.crt
      private_key: certs/node.key
      ca: certs/clients-ca.crt
    connection_timeout: 3s
    shutdown_timeout: 5s
    max_recv_message_size: 1048576
    max_send_message_size: 1048576
    max_connections: 128
    max_concurrent_streams: 32
    max_header_list_size: 8192
