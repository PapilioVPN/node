startup_timeout: 10s
shutdown_timeout: 155s
# Management API: only provision trusted controller certificates and broker ACLs.
# For actual host identity in Docker, pass --uts=host to run.sh.
# Interface observations use the current network namespace; choose --network=host for host scope.
# Process observations use the current PID namespace; choose --pid=host for host scope.
# Filesystem observations use visible paths; bind only the needed host paths read-only.
# Host uptime requires a zero BOOTTIME namespace offset, verified in packaged tests.
sessions:
  # Bind these specific host sources read-only when running in Docker.
  bus_socket_path: /run/dbus/system_bus_socket
  utmp_path: /run/utmp
communications:
  requests:
    timeout: 1s
    nats:
      # Unique deployment prefix; operation suffixes belong to the versioned API.
      subject_prefix: papilio.example-node
      # Applied per subscription, configured once for all installed operations.
      pending_messages: 64
      pending_bytes: 65536
      shutdown_timeout: 1s
  http:
    address: 127.0.0.1:8443
    tls:
      certificate: certs/node.crt
      private_key: certs/node.key
      ca: certs/clients-ca.crt
    read_timeout: 5s
    write_timeout: 10s
    idle_timeout: 30s
    shutdown_timeout: 10s
    body_limit: 1048576
    concurrency: 1024
  grpc:
    address: 127.0.0.1:8444
    tls:
      certificate: certs/node.crt
      private_key: certs/node.key
      ca: certs/clients-ca.crt
    connection_timeout: 3s
    shutdown_timeout: 5s
    max_recv_message_size: 1048576
    max_send_message_size: 1048576
    max_connections: 128
    max_concurrent_streams: 32
    max_header_list_size: 8192
  # Omit a communication block to disable that transport.
  # NATS requires a separately operated broker with certificate mapping and subject ACLs.
  nats:
    servers: [tls://localhost:4222]
    tls:
      certificate: certs/node-client.crt
      private_key: certs/node-client.key
      ca: certs/broker-ca.crt
    # Set false only when the broker uses native INFO-before-TLS negotiation.
    tls_handshake_first: true
    connect_timeout: 3s
    shutdown_timeout: 5s
    write_timeout: 3s
    reconnect_wait: 1s
    reconnect_jitter: 500ms
    max_reconnects: 10
    # Native high-water mark, with up to one protocol message of overshoot.
    # Set -1 to reject publishing while reconnecting instead of buffering.
    reconnect_buffer_size: 1048576
    ping_interval: 15s
    max_pings_outstanding: 2

# Optional ordered declarations; each configured instance starts with Node.
# Mount the selected executable and config explicitly. Native API must be local.
# instances:
#   - id: edge-a
#     engine: xray
#     stop_timeout: 2s
#     xray:
#       binary: /opt/xray/xray
#       configuration: /etc/xray/config.json
#       # Existing private writable scratch directory; required for candidate checks.
#       work_directory: /var/lib/node/xray/edge-a/work
#       # Optional existing durable directory for recovery, owned by the Node user with mode 0700.
#       state_directory: /var/lib/node/xray/edge-a/state
#       api:
#         network: tcp
#         address: 127.0.0.1:10085
# Keep the sum of engine/transport/subscription drain budgets below shutdown_timeout.
