syntax = "proto3";

package papilio.node.xray.v1;

option go_package = "github.com/PapilioVPN/node/internal/modules/engines/xray/grpcapi/proto/v1;xrayv1";

service XrayService {
  // Executes the selected configured binary's native version command only.
  // These facts may differ from a previously started process after file replacement.
  rpc GetBinaryInfo(GetBinaryInfoRequest) returns (GetBinaryInfoResponse);
  // Observes the configured local API's Go runtime, not host RSS or traffic health.
  rpc GetRuntimeInfo(GetRuntimeInfoRequest) returns (GetRuntimeInfoResponse);
  // Reads one exact native traffic counter without resetting it.
  rpc GetTrafficCounter(GetTrafficCounterRequest) returns (GetTrafficCounterResponse);
  // Reads all existing traffic counters in one scope without resetting them.
  // Complete response or resource-limit error; native Xray offers no pagination.
  rpc ListTrafficCounters(ListTrafficCountersRequest) returns (ListTrafficCountersResponse);
}

enum TrafficScope {
  TRAFFIC_SCOPE_UNSPECIFIED = 0;
  TRAFFIC_SCOPE_USER = 1;
  TRAFFIC_SCOPE_INBOUND = 2;
  TRAFFIC_SCOPE_OUTBOUND = 3;
}

enum TrafficDirection {
  TRAFFIC_DIRECTION_UNSPECIFIED = 0;
  TRAFFIC_DIRECTION_UPLINK = 1;
  TRAFFIC_DIRECTION_DOWNLINK = 2;
}

message GetTrafficCounterRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Exact native user email or inbound/outbound tag; never trimmed or normalized.
  string name = 3;
  TrafficDirection direction = 4;
}

message GetTrafficCounterResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  TrafficDirection direction = 4;
  // Native signed int64 bytes, preserving overflow/reset semantics.
  int64 bytes = 5;
  int64 observed_at_unix_ms = 6;
}

message GetRuntimeInfoRequest {
  string instance_id = 1;
}

message GetRuntimeInfoResponse {
  string instance_id = 1;
  RuntimeInfo runtime = 2;
}

message RuntimeInfo {
  uint32 goroutines = 1;
  uint32 gc_count = 2;
  uint64 allocated_bytes = 3;
  uint64 total_allocated_bytes = 4;
  // Bytes obtained from the OS by Go's runtime (MemStats.Sys), not process RSS.
  uint64 sys_bytes = 5;
  uint64 mallocs = 6;
  uint64 frees = 7;
  uint64 live_objects = 8;
  uint64 total_gc_pause_ns = 9;
  // Seconds since the native StatsService was constructed, at native uint32 precision.
  uint32 uptime_seconds = 10;
  int64 observed_at_unix_ms = 11;
}

message GetBinaryInfoRequest {
  string instance_id = 1;
}

message GetBinaryInfoResponse {
  string instance_id = 1;
  BinaryInfo binary = 2;
}

// Configured executable metadata, not process state, readiness or native API support.
message BinaryInfo {
  string version = 1;
  string build = 2;
  string go_version = 3;
  string operating_system = 4;
  string architecture = 5;
  int64 observed_at_unix_ms = 6;
}

message ListTrafficCountersRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
}

message ListTrafficCountersResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Ordered by exact name then lexical direction (downlink, uplink).
  repeated TrafficCounterEntry items = 3;
  // Completion of the observation, not an atomic snapshot time.
  int64 observed_at_unix_ms = 4;
}

message TrafficCounterEntry {
  string name = 1;
  TrafficDirection direction = 2;
  int64 bytes = 3;
}
