syntax = "proto3";

package papilio.node.xray.v1;

option go_package = "github.com/PapilioVPN/node/internal/modules/engines/xray/grpcapi/proto/v1;xrayv1";

service XrayService {
  // One live native addition after an inbound-type preflight. Not atomic against
  // external inbound replacement; no remove-before-add or application retry.
  rpc AddInboundUser(AddInboundUserRequest) returns (AddInboundUserResponse);
  // One live native removal; no config persistence or established-session claim.
  // Lost replies can hide an applied change. No application retry.
  rpc RemoveInboundUser(RemoveInboundUserRequest) returns (RemoveInboundUserResponse);
  // Executes the selected configured binary's native version command only.
  // These facts may differ from a previously started process after file replacement.
  rpc GetBinaryInfo(GetBinaryInfoRequest) returns (GetBinaryInfoResponse);
  // Observes the configured local API's Go runtime, not host RSS or traffic health.
  rpc GetRuntimeInfo(GetRuntimeInfoRequest) returns (GetRuntimeInfoResponse);
  // Reads one exact native traffic counter without resetting it.
  rpc GetTrafficCounter(GetTrafficCounterRequest) returns (GetTrafficCounterResponse);
  // Atomically swaps one exact existing counter with zero and returns prior bytes.
  // No application retry. A missing response can follow an applied reset.
  rpc ResetTrafficCounter(ResetTrafficCounterRequest) returns (ResetTrafficCounterResponse);
  // Discovers one exact scope without reset, then resets selected counters in order.
  // Non-atomic 1+N fallback: stops on first failure and retains progress in details.
  rpc ResetTrafficCounters(ResetTrafficCountersRequest) returns (ResetTrafficCountersResponse);
  // Two exact non-reset reads; absent directions are omitted, never zero-filled.
  rpc GetTrafficPair(GetTrafficPairRequest) returns (GetTrafficPairResponse);
  // Attempts uplink then downlink, not atomically. Missing directions are retained.
  // Other failures stop and preserve observed progress in typed error details.
  rpc ResetTrafficPair(ResetTrafficPairRequest) returns (ResetTrafficPairResponse);
  // Reads all existing traffic counters in one scope without resetting them.
  // Complete response or resource-limit error; native Xray offers no pagination.
  rpc ListTrafficCounters(ListTrafficCountersRequest) returns (ListTrafficCountersResponse);
  // Counts distinct IPs tracked by native session contexts, not open connections.
  // Session cleanup can lag client disconnect; this is not a presence guarantee.
  rpc GetUserOnlineStats(GetUserOnlineStatsRequest) returns (GetUserOnlineStatsResponse);
  rpc ListUserOnlineIPs(ListUserOnlineIPsRequest) returns (ListUserOnlineIPsResponse);
  rpc ListOnlineUsers(ListOnlineUsersRequest) returns (ListOnlineUsersResponse);
  // Native membership count only, not online users or a user-list snapshot.
  rpc GetInboundUserCount(GetInboundUserCountRequest) returns (GetInboundUserCountResponse);
  // Ordered references only; the native API does not return rule conditions.
  rpc ListRoutingRules(ListRoutingRulesRequest) returns (ListRoutingRulesResponse);
  // Native field presence is retained; this does not probe or override routing.
  rpc GetBalancerInfo(GetBalancerInfoRequest) returns (GetBalancerInfoResponse);
  // Native route selection can advance balancers, resolve DNS and fire webhooks.
  // A lost reply may follow effects. Never replay automatically.
  rpc TestRoute(TestRouteRequest) returns (TestRouteResponse);
  // One native assignment; an explicitly empty target clears the override.
  // Completion does not establish outbound existence or persistence. No retry.
  rpc OverrideBalancerTarget(OverrideBalancerTargetRequest) returns (OverrideBalancerTargetResponse);
  // Removes exact-tag rules live. Missing tags are acknowledged native no-ops;
  // no count, persistence or established-session termination is promised.
  rpc RemoveRoutingRule(RemoveRoutingRuleRequest) returns (RemoveRoutingRuleResponse);
  // Builds one native routing.rules[] object with the selected instance binary,
  // then applies once. Replace drops previous rules and balancers. No retry.
  rpc AddRoutingRule(AddRoutingRuleRequest) returns (AddRoutingRuleResponse);
  // Reads existing observatory facts, not a new probe or outbound membership.
  // Native API has no tag projection; each operation reads its full observation.
  rpc GetOutboundStatus(GetOutboundStatusRequest) returns (GetOutboundStatusResponse);
  rpc ListOutboundStatuses(ListOutboundStatusesRequest) returns (ListOutboundStatusesResponse);
}

enum TrafficScope {
  TRAFFIC_SCOPE_UNSPECIFIED = 0;
  TRAFFIC_SCOPE_USER = 1;
  TRAFFIC_SCOPE_INBOUND = 2;
  TRAFFIC_SCOPE_OUTBOUND = 3;
}

enum TrafficDirection {
  TRAFFIC_DIRECTION_UNSPECIFIED = 0;
  TRAFFIC_DIRECTION_UPLINK = 1;
  TRAFFIC_DIRECTION_DOWNLINK = 2;
}

message GetTrafficCounterRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Exact native user email or inbound/outbound tag; never trimmed or normalized.
  string name = 3;
  TrafficDirection direction = 4;
}

message GetTrafficCounterResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  TrafficDirection direction = 4;
  // Native signed int64 bytes, preserving overflow/reset semantics.
  int64 bytes = 5;
  int64 observed_at_unix_ms = 6;
}

message GetRuntimeInfoRequest {
  string instance_id = 1;
}

message GetRuntimeInfoResponse {
  string instance_id = 1;
  RuntimeInfo runtime = 2;
}

message RuntimeInfo {
  uint32 goroutines = 1;
  uint32 gc_count = 2;
  uint64 allocated_bytes = 3;
  uint64 total_allocated_bytes = 4;
  // Bytes obtained from the OS by Go's runtime (MemStats.Sys), not process RSS.
  uint64 sys_bytes = 5;
  uint64 mallocs = 6;
  uint64 frees = 7;
  uint64 live_objects = 8;
  uint64 total_gc_pause_ns = 9;
  // Seconds since the native StatsService was constructed, at native uint32 precision.
  uint32 uptime_seconds = 10;
  int64 observed_at_unix_ms = 11;
}

message GetBinaryInfoRequest {
  string instance_id = 1;
}

message GetBinaryInfoResponse {
  string instance_id = 1;
  BinaryInfo binary = 2;
}

// Configured executable metadata, not process state, readiness or native API support.
message BinaryInfo {
  string version = 1;
  string build = 2;
  string go_version = 3;
  string operating_system = 4;
  string architecture = 5;
  int64 observed_at_unix_ms = 6;
}

message ListTrafficCountersRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
}

message ListTrafficCountersResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Ordered by exact name then lexical direction (downlink, uplink).
  repeated TrafficCounterEntry items = 3;
  // Completion of the observation, not an atomic snapshot time.
  int64 observed_at_unix_ms = 4;
}

message TrafficCounterEntry {
  string name = 1;
  TrafficDirection direction = 2;
  int64 bytes = 3;
}

message GetUserOnlineStatsRequest {
  string instance_id = 1;
  // Exact native email, never normalized.
  string email = 2;
}
message GetUserOnlineStatsResponse {
  string instance_id = 1;
  string email = 2;
  int64 online_ip_count = 3;
  int64 observed_at_unix_ms = 4;
}
message ListUserOnlineIPsRequest {
  string instance_id = 1;
  string email = 2;
}
message ListUserOnlineIPsResponse {
  string instance_id = 1;
  string email = 2;
  // Complete result, ordered by exact native IP key; no native pagination.
  repeated OnlineIP items = 3;
  int64 observed_at_unix_ms = 4;
}
message OnlineIP {
  string ip = 1;
  // Native last connection registration time, not an activity heartbeat.
  int64 last_seen_unix_seconds = 2;
}
message ListOnlineUsersRequest {
  string instance_id = 1;
}
message ListOnlineUsersResponse {
  string instance_id = 1;
  // Exact native emails in lexical order; complete result or resource-limit error.
  repeated string emails = 2;
  int64 observed_at_unix_ms = 3;
}

message ResetTrafficCounterRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  TrafficDirection direction = 4;
}

message ResetTrafficCounterResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  TrafficDirection direction = 4;
  // Previous native signed int64 bytes, before one atomic swap with zero.
  int64 previous_bytes = 5;
  // Node's receipt of the acknowledgement, not the native reset's timestamp.
  int64 acknowledged_at_unix_ms = 6;
}

enum TrafficCounterResetOutcome {
  TRAFFIC_COUNTER_RESET_OUTCOME_UNSPECIFIED = 0;
  TRAFFIC_COUNTER_RESET_OUTCOME_NOT_APPLIED = 1;
  TRAFFIC_COUNTER_RESET_OUTCOME_UNKNOWN = 2;
}

// Delivered in gRPC error details after application selection. Missing details or
// an undelivered response never establish NOT_APPLIED. A read cannot recover prior
// usage after an unknown reset; blindly retrying can discard more usage.
message TrafficCounterResetFailure {
  TrafficCounterResetOutcome outcome = 1;
}

message ResetTrafficCountersRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Required positive bound. Excess selection fails before any reset.
  uint32 max_counters = 3;
}

enum TrafficCounterResetState {
  TRAFFIC_COUNTER_RESET_STATE_UNSPECIFIED = 0;
  TRAFFIC_COUNTER_RESET_STATE_NOT_ATTEMPTED = 1;
  TRAFFIC_COUNTER_RESET_STATE_ACKNOWLEDGED = 2;
  TRAFFIC_COUNTER_RESET_STATE_NOT_APPLIED = 3;
  TRAFFIC_COUNTER_RESET_STATE_UNKNOWN = 4;
  // Pair direction absent at its exact native request; no counter was created.
  TRAFFIC_COUNTER_RESET_STATE_MISSING = 5;
}

message TrafficCounterResetAcknowledgement {
  // Previous native signed bytes from the atomic swap, not from discovery.
  int64 previous_bytes = 1;
  int64 acknowledged_at_unix_ms = 2;
}

message TrafficCounterResetEntry {
  string name = 1;
  TrafficDirection direction = 2;
  TrafficCounterResetState state = 3;
  // Present only when state is ACKNOWLEDGED; zero bytes are valid.
  TrafficCounterResetAcknowledgement acknowledgement = 4;
}

message ResetTrafficCountersResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  // Every selected identity, ordered by exact name then direction.
  repeated TrafficCounterResetEntry items = 3;
  // Absent when preflight did not complete. This is not an atomic snapshot.
  optional int64 selected_at_unix_ms = 4;
}

// A failed operation is never a successful partial reset. Delivered details retain
// Node's observed effects; an empty report means no swaps were invoked. Missing
// details/lost replies can hide effects, including all swaps. Do not blindly replay.
message TrafficCountersResetFailure {
  ResetTrafficCountersResponse progress = 1;
}

message GetTrafficPairRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
}

message TrafficCounterObservation {
  int64 bytes = 1;
  int64 observed_at_unix_ms = 2;
}

message GetTrafficPairResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  // Independent observations, not an atomic snapshot. Absent means missing.
  TrafficCounterObservation uplink = 4;
  TrafficCounterObservation downlink = 5;
}

message ResetTrafficPairRequest {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
}

message ResetTrafficPairResponse {
  string instance_id = 1;
  TrafficScope scope = 2;
  string name = 3;
  // Exactly uplink then downlink, including missing/unattempted directions.
  repeated TrafficCounterResetEntry items = 4;
}

// Failure retains confirmed, missing, unattempted and uncertain effects. Lost or
// absent details can hide effects; a current read cannot recover previous bytes.
message TrafficPairResetFailure {
  ResetTrafficPairResponse progress = 1;
}

message RemoveInboundUserRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  // Preserved as provided; native protocols own case matching semantics.
  string email = 3;
}

message RemoveInboundUserResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
  // Native completion acknowledged, not proof of previous existence or persistence.
  int64 acknowledged_at_unix_ms = 4;
}

enum UserMutationOutcome {
  USER_MUTATION_OUTCOME_UNSPECIFIED = 0;
  USER_MUTATION_OUTCOME_NOT_APPLIED = 1;
  USER_MUTATION_OUTCOME_UNKNOWN = 2;
}

// Missing details or an undelivered reply never establish NOT_APPLIED.
message UserMutationFailure {
  UserMutationOutcome outcome = 1;
}

message AddInboundUserRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  InboundUser user = 3;
}

message InboundUser {
  string email = 1;
  uint32 level = 2;
  // Exactly one account; credentials are never included in the response.
  oneof account {
    VLESSAccount vless = 3;
    VMessAccount vmess = 4;
    PasswordAccount trojan = 5;
    ShadowsocksAccount shadowsocks = 6;
    Shadowsocks2022Account shadowsocks_2022 = 7;
    HysteriaAccount hysteria = 8;
    PasswordAccount masque = 9;
    WireGuardAccount wireguard = 10;
  }
}

message VLESSAccount {
  // Uses native Xray UUID parsing, including supported short identifiers.
  string id = 1;
  string flow = 2;
}
message VMessAccount { string id = 1; }
message PasswordAccount { string password = 1; }
message HysteriaAccount { string auth = 1; }

enum ShadowsocksCipher {
  SHADOWSOCKS_CIPHER_UNSPECIFIED = 0;
  SHADOWSOCKS_CIPHER_AES_128_GCM = 1;
  SHADOWSOCKS_CIPHER_AES_256_GCM = 2;
  SHADOWSOCKS_CIPHER_CHACHA20_POLY1305 = 3;
  SHADOWSOCKS_CIPHER_XCHACHA20_POLY1305 = 4;
  // Legacy compatibility only; current pinned Xray rejects this cipher.
  SHADOWSOCKS_CIPHER_NONE = 5;
}
message ShadowsocksAccount {
  string password = 1;
  ShadowsocksCipher cipher = 2;
  bool iv_check = 3;
}
message Shadowsocks2022Account {
  // Raw 16/32-byte key, not an already base64-encoded string.
  bytes key = 1;
}
message WireGuardAccount {
  bytes public_key = 1;
  // Empty preserves native omission; it does not promise clearing a prior PSK.
  bytes pre_shared_key = 2;
  repeated string allowed_ips = 3;
  // Absence preserves omission; explicit zero disables persistent keepalive.
  optional uint32 keep_alive_seconds = 4;
}

message AddInboundUserResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
  // Native completion, not durable config or a strict-create guarantee.
  int64 acknowledged_at_unix_ms = 4;
}

message GetInboundUserCountRequest {
  string instance_id = 1;
  string inbound_tag = 2;
}

message GetInboundUserCountResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  // Preserve the full nonnegative native int64 range. Zero is a valid count.
  int64 count = 3;
  int64 observed_at_unix_ms = 4;
}

message ListRoutingRulesRequest { string instance_id = 1; }
message RoutingRuleReference {
  string outbound_tag = 1;
  string rule_tag = 2;
}
message ListRoutingRulesResponse {
  string instance_id = 1;
  // Native priority order, retaining duplicate/empty tags. Not a config snapshot.
  repeated RoutingRuleReference rules = 2;
  int64 observed_at_unix_ms = 3;
}

message GetBalancerInfoRequest {
  string instance_id = 1;
  string balancer_tag = 2;
}
message BalancerPrincipalTargets { repeated string tags = 1; }
message GetBalancerInfoResponse {
  string instance_id = 1;
  string balancer_tag = 2;
  // Absent is unavailable; present empty means no override was reported.
  optional string override_target = 3;
  // Absent may reflect an internally suppressed native lookup error. Present
  // empty is a reported empty result. Targets are strategy-dependent observations.
  BalancerPrincipalTargets principal_targets = 4;
  int64 observed_at_unix_ms = 5;
}

enum RoutingNetwork {
  ROUTING_NETWORK_UNKNOWN = 0;
  ROUTING_NETWORK_TCP = 1;
  ROUTING_NETWORK_UDP = 2;
  ROUTING_NETWORK_UNIX = 3;
}

// Routing facts, not a real connection or an engine configuration. IP strings
// accept valid unzoned addresses and return canonical text, retaining mapped IPv6.
message RoutingContext {
  string inbound_tag = 1;
  RoutingNetwork network = 2;
  repeated string source_ips = 3;
  uint32 source_port = 4;
  repeated string target_ips = 5;
  uint32 target_port = 6;
  string target_domain = 7;
  string protocol = 8;
  string user = 9;
  map<string, string> attributes = 10;
  repeated string local_ips = 11;
  uint32 local_port = 12;
  uint32 vless_route = 13;
}

message TestRouteRequest {
  string instance_id = 1;
  // Required; an explicitly empty context is valid native input.
  RoutingContext context = 2;
  // Native prefixes, including empty/unknown prefixes. Empty selects all fields.
  repeated string field_selectors = 3;
  // Requests native publication only where supported; not a delivery guarantee.
  // False does not disable selection, DNS or webhook effects.
  bool publish_result = 4;
}

message RoutingResult {
  // Only native projected fields. Omitted values are not inferred from input.
  // The pinned engine omits vless_route even when it affected selection.
  RoutingContext context = 1;
  string outbound_tag = 2;
  repeated string outbound_group_tags = 3;
}

message TestRouteResponse {
  string instance_id = 1;
  RoutingResult route = 2;
  // Node receipt of completion, not webhook completion or event delivery.
  int64 acknowledged_at_unix_ms = 3;
}

enum RoutingProbeOutcome {
  ROUTING_PROBE_OUTCOME_UNSPECIFIED = 0;
  ROUTING_PROBE_OUTCOME_NOT_EXECUTED = 1;
  ROUTING_PROBE_OUTCOME_UNKNOWN = 2;
}

// Missing details or an undelivered response never prove that a probe had no
// effects. NOT_EXECUTED denotes known rejection before any supported native probe.
message TestRouteFailure { RoutingProbeOutcome outcome = 1; }

message OverrideBalancerTargetRequest {
  string instance_id = 1;
  string balancer_tag = 2;
  // Required presence. Only present empty clears; whitespace is an opaque target.
  optional string target = 3;
}

message OverrideBalancerTargetResponse {
  string instance_id = 1;
  string balancer_tag = 2;
  // Acknowledged assignment, not a fenced observation of the current target.
  string target = 3;
  int64 acknowledged_at_unix_ms = 4;
}

enum RoutingMutationOutcome {
  ROUTING_MUTATION_OUTCOME_UNSPECIFIED = 0;
  ROUTING_MUTATION_OUTCOME_NOT_APPLIED = 1;
  ROUTING_MUTATION_OUTCOME_UNKNOWN = 2;
}

// Missing details or an undelivered reply never establish NOT_APPLIED.
message RoutingMutationFailure { RoutingMutationOutcome outcome = 1; }

message RemoveRoutingRuleRequest {
  string instance_id = 1;
  // Required nonempty native tag, preserved exactly, including whitespace.
  string rule_tag = 2;
}

message RemoveRoutingRuleResponse {
  string instance_id = 1;
  string rule_tag = 2;
  // Native completion, not proof of previous membership or durable configuration.
  int64 acknowledged_at_unix_ms = 3;
}

enum RoutingRuleMode {
  ROUTING_RULE_MODE_UNSPECIFIED = 0;
  ROUTING_RULE_MODE_APPEND = 1;
  ROUTING_RULE_MODE_REPLACE = 2;
}

message AddRoutingRuleRequest {
  string instance_id = 1;
  // One native JSON object, retaining the engine's complete rule schema.
  bytes rule_json = 2;
  // Required explicit intent. Replace is not prepend and removes old balancers.
  RoutingRuleMode mode = 3;
}

message AddRoutingRuleResponse {
  string instance_id = 1;
  // Native tag; empty is a valid anonymous rule, not a missing acknowledgement.
  string rule_tag = 2;
  RoutingRuleMode mode = 3;
  int64 acknowledged_at_unix_ms = 4;
}

message OutboundHealthPing {
  int64 total_samples = 1;
  int64 failed_samples = 2;
  int64 deviation_ns = 3;
  int64 average_ns = 4;
  int64 max_ns = 5;
  int64 min_ns = 6;
}

message OutboundStatus {
  string outbound_tag = 1;
  bool alive = 2;
  // Retains native failed-probe sentinels; zero does not imply absence.
  int64 delay_ms = 3;
  // Burst does not provide these timestamps and returns zero.
  int64 last_seen_unix_sec = 4;
  int64 last_try_unix_sec = 5;
  OutboundHealthPing health_ping = 6;
}

message GetOutboundStatusRequest {
  string instance_id = 1;
  // Required presence. Present empty selects an anonymous observation.
  optional string outbound_tag = 2;
}

message GetOutboundStatusResponse {
  string instance_id = 1;
  string outbound_tag = 2;
  // Absence is no observed record, not successful zero latency or membership.
  OutboundStatus status = 3;
  int64 observed_at_unix_ms = 4;
}

message ListOutboundStatusesRequest { string instance_id = 1; }

message ListOutboundStatusesResponse {
  string instance_id = 1;
  repeated OutboundStatus statuses = 2;
  // Node receipt/completion time, not when native probes were executed.
  int64 observed_at_unix_ms = 3;
}
