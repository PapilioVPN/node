syntax = "proto3";

package papilio.node.v1;

option go_package = "github.com/PapilioVPN/node/internal/modules/instances/grpcapi/proto/v1;instancesv1";

service InstanceService {
  rpc GetInstanceStatus(GetInstanceStatusRequest) returns (GetInstanceStatusResponse);
  // Admission/spawn only, not readiness. Execution outlives the request.
  rpc StartInstance(StartInstanceRequest) returns (InstanceStatus);
  // Joins the selected execution; cancellation can follow an applied stop.
  rpc StopInstance(StopInstanceRequest) returns (InstanceStatus);
}

message GetInstanceStatusRequest {
  string instance_id = 1;
}

message GetInstanceStatusResponse {
  string instance_id = 1;
  string engine = 2;
  // Lifecycle observation only; RUNNING does not imply readiness or traffic health.
  InstanceState state = 3;
  // Absent when there is no completed execution failure. Raw errors are private.
  InstanceFailure failure = 4;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_STOPPED = 1;
  INSTANCE_STATE_RUNNING = 2;
  INSTANCE_STATE_STOPPING = 3;
  INSTANCE_STATE_EXITED = 4;
}

message InstanceFailure {
  InstanceFailureCode code = 1;
  // Present only when a nonnegative native exit code is known, including zero.
  optional int32 exit_code = 2;
}

enum InstanceFailureCode {
  INSTANCE_FAILURE_CODE_UNSPECIFIED = 0;
  INSTANCE_FAILURE_CODE_EXECUTION_FAILED = 1;
}

message StartInstanceRequest {
  string instance_id = 1;
}

message StopInstanceRequest {
  string instance_id = 1;
}

// Shared control outcome, also carried as a native gRPC error detail when known.
// An RPC failure or a lost response does not establish that no effect occurred.
// Keep GetInstanceStatusResponse's existing flat wire contract unchanged.
message InstanceStatus {
  string instance_id = 1;
  string engine = 2;
  InstanceState state = 3;
  InstanceFailure failure = 4;
}
