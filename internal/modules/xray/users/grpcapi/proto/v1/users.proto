syntax = "proto3";

package papilio.node.xray.v1;

option go_package = "github.com/PapilioVPN/node/internal/modules/xray/users/grpcapi/proto/v1;userv1";

message RemoveInboundUserRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  // Preserved as provided; native protocols own case matching semantics.
  string email = 3;
}

message RemoveInboundUserResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
  // Native completion acknowledged, not proof of previous existence or persistence.
  int64 acknowledged_at_unix_ms = 4;
}

enum UserMutationOutcome {
  USER_MUTATION_OUTCOME_UNSPECIFIED = 0;
  USER_MUTATION_OUTCOME_NOT_APPLIED = 1;
  USER_MUTATION_OUTCOME_UNKNOWN = 2;
}

// Missing details or an undelivered reply never establish NOT_APPLIED.
message UserMutationFailure {
  UserMutationOutcome outcome = 1;
}

message AddInboundUserRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  InboundUser user = 3;
}

message InboundUser {
  string email = 1;
  uint32 level = 2;
  // Exactly one account; credentials are never included in the response.
  oneof account {
    VLESSAccount vless = 3;
    VMessAccount vmess = 4;
    PasswordAccount trojan = 5;
    ShadowsocksAccount shadowsocks = 6;
    Shadowsocks2022Account shadowsocks_2022 = 7;
    HysteriaAccount hysteria = 8;
    PasswordAccount masque = 9;
    WireGuardAccount wireguard = 10;
  }
}

message VLESSAccount {
  // Uses native Xray UUID parsing, including supported short identifiers.
  string id = 1;
  string flow = 2;
}
message VMessAccount { string id = 1; }
message PasswordAccount { string password = 1; }
message HysteriaAccount { string auth = 1; }

enum ShadowsocksCipher {
  SHADOWSOCKS_CIPHER_UNSPECIFIED = 0;
  SHADOWSOCKS_CIPHER_AES_128_GCM = 1;
  SHADOWSOCKS_CIPHER_AES_256_GCM = 2;
  SHADOWSOCKS_CIPHER_CHACHA20_POLY1305 = 3;
  SHADOWSOCKS_CIPHER_XCHACHA20_POLY1305 = 4;
  // Legacy compatibility only; current pinned Xray rejects this cipher.
  SHADOWSOCKS_CIPHER_NONE = 5;
}
message ShadowsocksAccount {
  string password = 1;
  ShadowsocksCipher cipher = 2;
  bool iv_check = 3;
}
message Shadowsocks2022Account {
  // Raw 16/32-byte key, not an already base64-encoded string.
  bytes key = 1;
}
message WireGuardAccount {
  bytes public_key = 1;
  // Empty preserves native omission; it does not promise clearing a prior PSK.
  bytes pre_shared_key = 2;
  repeated string allowed_ips = 3;
  // Absence preserves omission; explicit zero disables persistent keepalive.
  optional uint32 keep_alive_seconds = 4;
}

message AddInboundUserResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
  // Native completion, not durable config or a strict-create guarantee.
  int64 acknowledged_at_unix_ms = 4;
}

message GetInboundUserCountRequest {
  string instance_id = 1;
  string inbound_tag = 2;
}

message GetInboundUserCountResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  // Preserve the full nonnegative native int64 range. Zero is a valid count.
  int64 count = 3;
  int64 observed_at_unix_ms = 4;
}

// Credential-free projection of one observed native user-manager record.
message InboundUserMetadata {
  string email = 1;
  uint32 level = 2;
  // Fully qualified native protobuf message name, not a Node dispatch key.
  string account_type = 3;
}

// Original observed account message, including credentials and extensions.
// This is not the AddInboundUser input: native readback may omit initial settings
// (e.g. Shadowsocks IVCheck) or differ from device state (e.g. WireGuard PSK).
message NativeUserAccount {
  string type_name = 1;
  bytes protobuf = 2;
}

message InboundUserRecord {
  string email = 1;
  uint32 level = 2;
  NativeUserAccount account = 3;
}

message GetInboundUserMetadataRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  // Nonblank exact email; native protocols own matching and stored identity.
  string email = 3;
}
message GetInboundUserMetadataResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  // Requested identity. The returned stored email may differ.
  string email = 3;
  // Absent on a completed missing lookup, never synthesized as an empty user.
  InboundUserMetadata user = 4;
  int64 observed_at_unix_ms = 5;
}
message ListInboundUserMetadataRequest {
  string instance_id = 1;
  string inbound_tag = 2;
}
message ListInboundUserMetadataResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  // Complete collection, including anonymous users and duplicates. Ordered by
  // email, level and account type; native relative order for equal keys.
  repeated InboundUserMetadata users = 3;
  // Node completion time, not an atomic snapshot or native membership revision.
  int64 observed_at_unix_ms = 4;
}
message GetInboundUserRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
}
message GetInboundUserResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
  InboundUserRecord user = 4;
  int64 observed_at_unix_ms = 5;
}
message ListInboundUsersRequest {
  string instance_id = 1;
  string inbound_tag = 2;
}
message ListInboundUsersResponse {
  string instance_id = 1;
  string inbound_tag = 2;
  // Same complete membership/ordering contract as the metadata collection.
  repeated InboundUserRecord users = 3;
  int64 observed_at_unix_ms = 4;
}
