syntax = "proto3";
package papilio.xray.observability.outboundhealth.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/observability/outboundhealth/grpcapi/proto/v1;healthv1";
import "google/protobuf/timestamp.proto";

service OutboundHealthService {
 rpc GetOutboundStatus(GetOutboundStatusRequest) returns (OutboundObservation);
 rpc ListOutboundStatuses(ListOutboundStatusesRequest) returns (OutboundStatusesPage);
}
message GetOutboundStatusRequest {
 string instance_id = 1;
 optional string outbound_tag = 2;
 uint32 max_sample_age_seconds = 3;
}
message ListOutboundStatusesRequest {
 string instance_id = 1;
 uint32 page_size = 2;
 string page_token = 3;
 uint32 max_sample_age_seconds = 4;
}
message HealthPing {
 int64 all = 1;
 int64 fail = 2;
 int64 deviation_ns = 3;
 int64 average_ns = 4;
 int64 max_ns = 5;
 int64 min_ns = 6;
}
message OutboundStatus {
 string outbound_tag = 1;
 bool alive = 2;
 int64 delay_ms = 3;
 optional int64 latency_ms = 4;
 int64 last_seen_unix_sec = 5;
 int64 last_try_unix_sec = 6;
 string mode = 7;
 HealthPing health_ping = 8;
 google.protobuf.Timestamp sampled_at = 9;
 optional int64 sample_age_seconds = 10;
 string freshness = 11;
}
message ObservationMetadata {
 string instance_id = 1;
 uint64 generation = 2;
 string source = 3;
 google.protobuf.Timestamp observed_at = 4;
 int64 duration_ns = 5;
 uint32 max_sample_age_seconds = 6;
}
message OutboundObservation {
 ObservationMetadata observation = 1;
 OutboundStatus status = 2;
}
message OutboundStatusesPage {
 ObservationMetadata observation = 1;
 repeated OutboundStatus statuses = 2;
 string next_page_token = 3;
 google.protobuf.Timestamp served_at = 4;
 google.protobuf.Timestamp expires_at = 5;
 uint32 total = 6;
}
