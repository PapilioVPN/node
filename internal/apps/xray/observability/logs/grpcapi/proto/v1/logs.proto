syntax = "proto3";
package papilio.xray.observability.logs.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/observability/logs/grpcapi/proto/v1;logsv1";
import "google/protobuf/timestamp.proto";

// All methods use bounded pulls. Follow returns at most fifty sanitized records
// after a cursor, waiting at most 1000 ms (zero is immediate). Reconnect with the
// last received next_cursor; an undelivered read can safely be repeated. There is
// no per-client queue, automatic retry or durable log subscription. HTTP and Core
// NATS use the same contract. The common request deadline can shorten any wait.
// limit=0 defaults to 50; larger limits reject. A cursor is required for follow.
// Fiber and Core NATS cannot propagate caller disconnect; their bounded request
// deadlines still end abandoned pulls. NATS Papilio-Deadline can shorten that bound.
service LogsService {
 rpc TailLogs(TailLogsRequest) returns (LogPage);
 rpc FollowLogs(FollowLogsRequest) returns (LogPage);
}
message TailLogsRequest { string instance_id = 1; uint32 limit = 2; }
message FollowLogsRequest { string instance_id = 1; string cursor = 2; uint32 limit = 3; uint32 wait_ms = 4; }
message LogRecord {
 uint64 start_offset = 1; uint64 next_offset = 2;
 string level = 3; string kind = 4; string message = 5;
 bool redacted = 6; bool truncated = 7; bool partial = 8;
}
message LogGap {
 string reason = 1; uint64 from_offset = 2; uint64 to_offset = 3;
 bool extent_known = 4; string previous_execution_id = 5;
}
// source=console means the merged stdout/stderr prefix owned by Instances.
// File-configured native logs are not captured. observed_at is Node read time.
// Details are projected to a closed safe vocabulary; native text is never sent.
// Capacity loss has unknown extent. Drain retained records, then stop following
// that execution when capacity_reached is true; future output cannot be captured
// by the current prefix source. A new execution is reported as an explicit gap.
// Native drops before console writes are not observable here. Gap reasons are
// tail_omitted, record_truncated, source_capacity_reached, position_uncertain and
// execution_changed. Unknown loss extent never supplies an invented end/count.
message LogPage {
 string instance_id = 1; string source = 2; string execution_id = 3;
 uint64 generation = 4; google.protobuf.Timestamp observed_at = 5;
 repeated LogRecord records = 6; repeated LogGap gaps = 7;
 string next_cursor = 8; bool capacity_reached = 9;
 bool position_uncertain = 10; bool reattached = 11; bool exited = 12;
}
