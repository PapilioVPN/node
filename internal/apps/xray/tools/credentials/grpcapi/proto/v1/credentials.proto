syntax = "proto3";
package papilio.xray.tools.credentials.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/tools/credentials/grpcapi/proto/v1;credentialsv1";
import "google/protobuf/timestamp.proto";

// Artifacts exist only in the current response. No replay, storage, logging,
// engine mutation or installation is implied by generation or derivation.
service CredentialsService {
 rpc GenerateUUID(GenerateUUIDRequest) returns (UUIDArtifact);
 rpc GenerateX25519(GenerateX25519Request) returns (CurveArtifact);
 rpc GenerateWireGuard(GenerateWireGuardRequest) returns (CurveArtifact);
 rpc GenerateMLDSA65(GenerateMLDSA65Request) returns (MLDSA65Artifact);
 rpc GenerateMLKEM768(GenerateMLKEM768Request) returns (MLKEM768Artifact);
 rpc GenerateVLESSEncryption(GenerateVLESSEncryptionRequest) returns (VLESSArtifact);
 rpc GenerateCertificate(GenerateCertificateRequest) returns (CertificateArtifact);
 rpc GetCertificateHashes(GetCertificateHashesRequest) returns (CertificateHashes);
 rpc GenerateECH(GenerateECHRequest) returns (ECHArtifact);
}
message GenerateUUIDRequest {
 string instance_id=1;
 // Absent selects random v4; present 1..30 UTF-8 bytes selects native v5.
 optional string name=2;
}
enum KeyEncoding {
 KEY_ENCODING_UNSPECIFIED=0;
 KEY_ENCODING_BASE64URL=1;
 KEY_ENCODING_BASE64=2;
}
message GenerateX25519Request {
 string instance_id=1;
 // Absent generates; present must be canonical 32-byte key in selected encoding.
 optional string private_key=2;
 // Default is unpadded base64url. Native output contains the clamped key.
 KeyEncoding encoding=3;
}
message GenerateWireGuardRequest {
 string instance_id=1;
 // Canonical padded standard base64. Absent generates fresh randomness.
 optional string private_key=2;
}
message GenerateMLDSA65Request {
 string instance_id=1;
 // Absent generates; present is a canonical unpadded-base64url 32-byte seed.
 optional string seed=2;
}
message GenerateMLKEM768Request {
 string instance_id=1;
 // Absent generates; present is a canonical unpadded-base64url 64-byte seed.
 optional string seed=2;
}
message GenerateVLESSEncryptionRequest {string instance_id=1;}
message GenerateCertificateRequest {
 string instance_id=1;
 repeated string domains=2;
 optional string common_name=3;
 optional string organization=4;
 bool authority=5;
 // Absent selects native 90 days. Explicit positive duration, at most 3650 days.
 optional int64 valid_for_ns=6;
}
message GetCertificateHashesRequest {
 string instance_id=1;
 // PEM or concatenated DER certificate bytes, at most 64 KiB/16 certificates.
 bytes certificate=2;
}
enum ECHFormat {
 ECH_FORMAT_UNSPECIFIED=0;
 ECH_FORMAT_BASE64=1;
 ECH_FORMAT_PEM=2;
}
message GenerateECHRequest {
 string instance_id=1;
 // Generation only. Absent uses native cloudflare-ech.com.
 optional string server_name=2;
 // Restoration only; native ECHServerKeys in padded standard base64, <=32 KiB.
 optional string server_keys=3;
 ECHFormat format=4;
}
message ArtifactMetadata {
 string instance_id=1;
 string tool=2;
 google.protobuf.Timestamp completed_at=3;
 int64 duration_ns=4;
}
message UUIDArtifact {ArtifactMetadata metadata=1; string uuid=2;}
message CurveArtifact {
 ArtifactMetadata metadata=1;
 string private_key=2;
 string public_key=3;
 // BLAKE3 digest of public-key bytes in the selected key encoding.
 string hash32=4;
 KeyEncoding encoding=5;
}
message MLDSA65Artifact {ArtifactMetadata metadata=1; string seed=2; string verify=3;}
message MLKEM768Artifact {ArtifactMetadata metadata=1; string seed=2; string client=3; string hash32=4;}
message AuthenticationPair {string decryption=1;string encryption=2;}
message VLESSArtifact {ArtifactMetadata metadata=1;AuthenticationPair x25519=2;AuthenticationPair mlkem768=3;}
message CertificateArtifact {ArtifactMetadata metadata=1;string certificate_pem=2;string private_key_pem=3;}
message CertificateHash {uint32 index=1;string common_name=2;string sha256=3;}
message CertificateHashes {ArtifactMetadata metadata=1;repeated CertificateHash hashes=2;}
message ECHArtifact {
 ArtifactMetadata metadata=1;
 // Each entry is independently usable. The pinned CLI's concatenated single
 // lists are separated, preserving their config bytes and order (at most 16).
 repeated string config_lists=2;
 string server_keys=3;
 ECHFormat format=4;
}
