syntax = "proto3";
package papilio.xray.users.accounts.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/users/accounts/grpcapi/proto/v1;accountsv1";
message AccountSource {
 string name = 1;
 bytes content = 2;
}
message AddAccountFromSourcesRequest {
 string instance_id = 1;
 string inbound_tag = 2;
 // Exact source identity. Explicit empty selects one unambiguous anonymous user.
 // Source inbound type must match the running target; no other settings apply.
 optional string email = 3;
 repeated AccountSource sources = 4;
}
