syntax = "proto3";
package papilio.xray.users.accounts.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/users/accounts/grpcapi/proto/v1;accountsv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/xray/users/accounts/grpcapi/proto/v1/control.proto";
import "internal/apps/xray/users/accounts/grpcapi/proto/v1/sources.proto";
import "internal/apps/xray/users/accounts/grpcapi/proto/v1/batches.proto";
import "internal/apps/xray/users/accounts/grpcapi/proto/v1/configurations.proto";
import "internal/apps/xray/runtime/configs/grpcapi/proto/v1/compilation.proto";
service AccountsService {
 rpc ListAccountMetadata(ListAccountMetadataRequest) returns (AccountMetadataPage);
 rpc ExportAccounts(ExportAccountsRequest) returns (AccountExportPage);
 rpc GetAccountMetadata(GetAccountRequest) returns (AccountMetadataObservation);
 rpc CheckAccountCompatibility(CheckAccountCompatibilityRequest) returns (AccountCompatibility);
 rpc PrepareAccountConfiguration(PrepareAccountConfigurationRequest) returns (papilio.xray.runtime.configs.v1.CompiledConfiguration);
  rpc AddAccounts(AddAccountsRequest) returns (AccountBatch);
  rpc RemoveAccounts(RemoveAccountsRequest) returns (AccountBatch);
  rpc AddAccountFromSources(AddAccountFromSourcesRequest) returns (AccountOperation);
  // Live native membership only, not durable desired-state replacement.
  rpc AddAccount(AddAccountRequest) returns (AccountOperation);
  // Protocol-specific removal; does not guarantee closing established sessions.
  rpc RemoveAccount(RemoveAccountRequest) returns (AccountOperation);
  rpc GetAccountControlStatus(GetAccountControlStatusRequest) returns (AccountControlStatus);
  // Native count only; does not fetch the collection. Protocols can omit anonymous users.
  rpc GetAccountCount(GetAccountCountRequest) returns (AccountCount);
  // Native exact lookup. Absence is a missing user, not a fabricated empty account.
  rpc GetAccount(GetAccountRequest) returns (AccountObservation);
}
message GetAccountCountRequest {
  string instance_id = 1;
  string inbound_tag = 2;
}
message GetAccountRequest {
  string instance_id = 1;
  string inbound_tag = 2;
  string email = 3;
}
message Observation {
  string instance_id = 1;
  string inbound_tag = 2;
  uint64 generation = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
}
message AccountCount {
  Observation observation = 1;
  int64 count = 2;
}
message Account {
  string email = 1;
  uint32 level = 2;
  // Native protocol.User protobuf, potentially containing credentials. Runtime
  // readback is distinct from desired state and may omit original settings.
  bytes configuration = 3;
}
message AccountObservation {
  Observation observation = 1;
  string requested_email = 2;
  Account user = 3;
}

// One full native read per retained observation, with no native cursor or limit.
// Continuations bind instance, inbound, view and page size and expire after 30s.
message ListAccountMetadataRequest { string instance_id = 1; string inbound_tag = 2; uint32 page_size = 3; string cursor = 4; }
message ExportAccountsRequest { string instance_id = 1; string inbound_tag = 2; uint32 page_size = 3; string cursor = 4; }
message AccountMetadata { string email = 1; uint32 level = 2; string account_type = 3; }
message AccountMetadataObservation { Observation observation = 1; string requested_email = 2; AccountMetadata user = 3; }
message AccountReadCost {
 // Complete uncompressed native protobuf payload, including credentials fetched
 // by the native API even when only metadata is returned. Not a heap ceiling.
 uint64 native_payload_bytes = 1;
 int64 native_duration_ns = 2;
 uint64 native_limit_bytes = 3;
}
message AccountMetadataPage { Observation observation = 1; repeated AccountMetadata users = 2; string next_cursor = 3; google.protobuf.Timestamp expires_at = 4; AccountReadCost read_cost = 5; }
// Explicit credential export: observed UserManager records, not original desired
// configuration. Protocols can omit constructor fields or anonymous users.
message AccountExportPage { Observation observation = 1; repeated Account users = 2; string next_cursor = 3; google.protobuf.Timestamp expires_at = 4; AccountReadCost read_cost = 5; }
message CheckAccountCompatibilityRequest { string instance_id = 1; string inbound_tag = 2; optional string account_type = 3; }
message AccountCompatibility {
 Observation observation = 1;
 string protocol = 2;
 string expected_account_type = 3;
 bool live_accounts = 4;
 string email_matching = 5;
 optional string requested_account_type = 6;
 optional bool compatible = 7;
 AccountGuidance guidance = 8;
}
