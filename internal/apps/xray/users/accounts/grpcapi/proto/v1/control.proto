syntax = "proto3";
package papilio.xray.users.accounts.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/users/accounts/grpcapi/proto/v1;accountsv1";
import "google/protobuf/timestamp.proto";
message AddAccountRequest {
 string instance_id = 1;
 string inbound_tag = 2;
 // Native protocol.User protobuf. Its account type must match the actual inbound.
 // Native managers assume a matching type; a mismatch may terminate the engine.
 // Structural type compatibility is checked before dispatch; no conversion or
 // atomic fence against external inbound replacement is implied.
 bytes configuration = 3;
}
message RemoveAccountRequest {
 string instance_id = 1;
 string inbound_tag = 2;
 // Presence is required. Explicit empty email keeps native protocol semantics;
 // some managers reject it, others can remove an anonymous member.
 optional string email = 3;
}
message GetAccountControlStatusRequest { string instance_id = 1; }
message AccountOperation {
 string instance_id = 1;
 string inbound_tag = 2;
 uint64 generation = 3;
 string kind = 4;
 string email = 5;
 string effect = 6;
 bool acknowledged = 7;
 bool requires_instance_restart = 8;
 google.protobuf.Timestamp observed_at = 9;
 int64 duration_ns = 10;
 AccountGuidance guidance = 11;
}
message AccountControlStatus {
 string instance_id = 1;
 uint64 generation = 2;
 string execution_state = 3;
 bool api_configured = 4;
 bool request_in_flight = 5;
 bool requires_instance_restart = 6;
 AccountOperation last_operation = 7;
 google.protobuf.Timestamp observed_at = 8;
}

message AccountGuidance {
 string reason = 1;
 string next_action = 2;
 string protocol = 3;
 string expected_account_type = 4;
 string actual_account_type = 5;
}
