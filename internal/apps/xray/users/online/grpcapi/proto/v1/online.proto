syntax = "proto3";
package papilio.xray.users.online.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/users/online/grpcapi/proto/v1;onlinev1";
import "google/protobuf/timestamp.proto";

service OnlineService {
 rpc GetUserOnlineStats(GetUserOnlineStatsRequest) returns (UserOnlineStats);
 rpc ListUserOnlineIPs(ListUserOnlineIPsRequest) returns (UserOnlineIPs);
 rpc ListOnlineUsers(ListOnlineUsersRequest) returns (OnlinePage);
 rpc ListOnlineRecords(ListOnlineRecordsRequest) returns (OnlinePage);
}
message GetUserOnlineStatsRequest { string instance_id = 1; string email = 2; }
message ListUserOnlineIPsRequest {
 string instance_id = 1;
 string email = 2;
 uint32 page_size = 3;
 string page_token = 4;
}
enum OnlineState {
 ONLINE_STATE_UNSPECIFIED = 0;
 ONLINE_STATE_ONLINE = 1;
 ONLINE_STATE_OFFLINE = 2;
 // No native map: unused/missing identity and disabled policy are indistinguishable.
 ONLINE_STATE_UNTRACKED = 3;
}
message OnlineObservation {
 string instance_id = 1;
 string email = 2;
 uint64 generation = 3;
 string source = 4;
 google.protobuf.Timestamp observed_at = 5;
 int64 duration_ns = 6;
}
message UserOnlineStats {
 OnlineObservation observation = 1;
 OnlineState state = 2;
 // Distinct tracked IPs, not connection count. Absent for an unregistered map.
 optional int64 count = 3;
}
message OnlineIP {
 string ip = 1;
 // Native last AddIP Unix seconds; deleted on final connection removal.
 int64 last_seen_unix_seconds = 2;
}
message UserOnlineIPs {
 OnlineObservation observation = 1;
 OnlineState state = 2;
 // At most 50 records. Continue with page.next_page_token and the same scope/size.
 repeated OnlineIP ips = 3;
 OnlinePaging page = 4;
}

// Size 0 selects 50; explicit sizes 1..50. Continuations perform no native RPC.
message ListOnlineUsersRequest {
 string instance_id = 1;
 uint32 page_size = 2;
 string page_token = 3;
}
message ListOnlineRecordsRequest {
 string instance_id = 1;
 uint32 page_size = 2;
 string page_token = 3;
}
// A retained non-atomic native observation, bound to instance, operation,
// generation and page size. Expires after 30 seconds; Node restart loses tokens.
// An engine execution change aborts continuation. Start again without a token.
message OnlinePaging {
 string observation_id = 1;
 google.protobuf.Timestamp expires_at = 2;
 google.protobuf.Timestamp served_at = 3;
 // True only for the initial native observation, false for retained pages.
 bool fresh = 4;
 uint32 total = 5;
 string next_page_token = 6;
}
message OnlineRecord {
 string email = 1;
 // Present only for detailed records. Last-seen is native AddIP time.
 OnlineIP ip = 2;
}
message OnlinePage {
 OnlineObservation observation = 1;
 OnlinePaging page = 2;
 // Online users only. Details are flattened email/IP rows, at most 50 per page.
 repeated OnlineRecord records = 3;
}
