syntax = "proto3";
package papilio.xray.proxies.outbounds.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/proxies/outbounds/grpcapi/proto/v1;outboundsv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/xray/proxies/outbounds/grpcapi/proto/v1/control.proto";
service OutboundsService {
  rpc PlanOutboundReplacement(PlanOutboundReplacementRequest) returns (OutboundReplacementPlan);
  rpc ApplyOutboundReplacement(OutboundReplacementRequest) returns (OutboundReplacementResult);
  rpc GetOutboundReplacement(OutboundReplacementRequest) returns (OutboundReplacementResult);
  rpc AddOutbound(AddOutboundRequest) returns (OutboundOperation);
  rpc AddOutboundFromSources(AddOutboundFromSourcesRequest) returns (OutboundOperation);
  // Membership removal only; existing connections/resources are not closed.
  rpc RemoveOutbound(RemoveOutboundRequest) returns (OutboundOperation);
  rpc GetOutboundControlStatus(GetOutboundControlStatusRequest) returns (OutboundControlStatus);
  // First page uses one bounded native RPC; continuation reuses that observation.
  // The internal API outbound is omitted by Xray.
  rpc ListOutbounds(ListOutboundsRequest) returns (OutboundConfigurations);
}
message ListOutboundsRequest {
  string instance_id = 1;
  uint32 page_size = 2; // Default/max 50; native unary response is still bounded separately.
  string page_token = 3;
}
message OutboundConfiguration {
  string tag = 1;
  // Native core.OutboundHandlerConfig projection: tag, sender and proxy settings,
  // potentially including credentials. Native readback does not retain source
  // expire/comment fields. Does not identify the default outbound or source order.
  bytes configuration = 2;
}
message OutboundConfigurations {
  string instance_id = 1;
  uint64 generation = 2;
  repeated OutboundConfiguration outbounds = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
  string next_page_token = 6;
  string source = 7;
  string default_state = 8; // unobservable; list order does not identify the default.
}
