syntax = "proto3";
package papilio.xray.proxies.outbounds.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/proxies/outbounds/grpcapi/proto/v1;outboundsv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/xray/runtime/configs/grpcapi/proto/v1/compilation.proto";
// Native errors may still change a missing default or retain constructed resources.
// This is neither an atomic insert/replacement nor an expiry/cleanup scheduler.
message AddOutboundRequest {
  string instance_id = 1;
  // Native core.OutboundHandlerConfig. expire/comment are unused by this Xray pin.
  bytes configuration = 2;
}
// Removes membership; missing tags succeed. Does not close resources/connections
// or promote another default. Changing default may affect otherwise unrelated flows.
message RemoveOutboundRequest {
  string instance_id = 1;
  string tag = 2;
}
message GetOutboundControlStatusRequest {
  string instance_id = 1;
}
message OutboundOperation {
  string instance_id = 1;
  uint64 generation = 2;
  string kind = 3;
  string tag = 4;
  // completed, not_applied or unknown; live changes are not durable desired state.
  string effect = 5;
  bool acknowledged = 6;
  bool requires_instance_restart = 7;
  google.protobuf.Timestamp observed_at = 8;
  int64 duration_ns = 9;
}
message OutboundControlStatus {
  string instance_id = 1;
  uint64 generation = 2;
  string execution_state = 3;
  bool api_configured = 4;
  bool request_in_flight = 5;
  bool requires_instance_restart = 6;
  OutboundOperation last_operation = 7;
  google.protobuf.Timestamp observed_at = 8;
}

// Compiles ordered native sources, then adds exactly one matching outbound.
// All other configuration sections and runtime environment changes are excluded.
message AddOutboundFromSourcesRequest {
  string instance_id = 1;
  string tag = 2;
  repeated papilio.xray.runtime.configs.v1.ConfigurationSource sources = 3;
}

// Exactly one configuration or ordered source set selects one named outbound.
// Policies are explicit: default_policy preserve/may_change, connection_policy
// retain/terminate. Native default membership cannot be observed or assigned.
message PlanOutboundReplacementRequest {
  string instance_id = 1;
  string tag = 2;
  bytes configuration = 3;
  repeated papilio.xray.runtime.configs.v1.ConfigurationSource sources = 4;
  string default_policy = 5;
  string connection_policy = 6;
}
message OutboundReplacementPlan {
  string plan_id = 1;
  string instance_id = 2;
  uint64 generation = 3;
  uint64 owner_revision = 4;
  string tag = 5;
  string mode = 6; // unchanged/live_remove_add/configs_restart
  string reason = 7;
  string default_state = 8;
  string current_sha256 = 9;
  string candidate_sha256 = 10;
  bool default_may_change = 11;
  bool existing_connections_retained = 12;
  bool native_resources_may_remain = 13;
  string next_action = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp expires_at = 16;
  string validation = 17; // handler_not_constructed; Add may fail after Remove.
  bool traffic_gap_possible = 18;
}
message OutboundReplacementRequest {
  string instance_id = 1;
  string plan_id = 2;
}
message OutboundReplacementStep {
  string kind = 1;
  string effect = 2;
  bool attempted = 3;
  bool acknowledged = 4;
  bool requires_instance_restart = 5;
  string error = 6;
  google.protobuf.Timestamp completed_at = 7;
}
// Formed application errors remain in this normal envelope. Missing replies are
// recovered by GetOutboundReplacement or by replaying the SAME plan identity.
// Replay never reruns Remove/Add. No automatic rollback or Configs write occurs.
message OutboundReplacementResult {
  string plan_id = 1;
  string instance_id = 2;
  uint64 generation = 3;
  string tag = 4;
  string outcome = 5;
  string error = 6;
  bool requires_instance_restart = 7;
  bool default_may_change = 8;
  bool native_resources_may_remain = 9;
  repeated OutboundReplacementStep steps = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}
