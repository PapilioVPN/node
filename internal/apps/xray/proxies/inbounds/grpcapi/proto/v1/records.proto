syntax = "proto3";
package papilio.xray.proxies.inbounds.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/proxies/inbounds/grpcapi/proto/v1;inboundsv1";
import "google/protobuf/timestamp.proto";
message ListInboundsRequest {
  string instance_id = 1;
  uint32 page_size = 2;
  string cursor = 3;
}
message ListInboundTagsRequest {
  string instance_id = 1;
  uint32 page_size = 2;
  string cursor = 3;
}
message InboundConfiguration {
  string tag = 1;
  // Native core.InboundHandlerConfig protobuf. Includes credentials and nested
  // TypedMessage settings. Preserves native fields without mirroring protocols.
  bytes configuration = 2;
}
message InboundConfigurations {
  string instance_id = 1;
  uint64 generation = 2;
  repeated InboundConfiguration inbounds = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
  string next_cursor = 6;
  google.protobuf.Timestamp expires_at = 7;
}
message InboundTags {
  string instance_id = 1;
  uint64 generation = 2;
  // Native order is unspecified. Empty/duplicate untagged values are retained.
  repeated string tags = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
  string next_cursor = 6;
  google.protobuf.Timestamp expires_at = 7;
}

// Safe structural metadata; no account records, credentials or receiver settings.
message InboundSummary {
  string tag = 1;
  string direction = 2;
  string protocol = 3;
  string native_type = 4;
  string account_type = 5;
  bool live_accounts = 6;
  string reason = 7;
  string email_matching = 8;
}
message ListInboundSummariesRequest {
  string instance_id = 1;
  uint32 page_size = 2;
  string cursor = 3;
}
message InboundSummaries {
  string instance_id = 1;
  uint64 generation = 2;
  repeated InboundSummary inbounds = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
  string next_cursor = 6;
  google.protobuf.Timestamp expires_at = 7;
}
message GetInboundCompatibilityRequest {
  string instance_id = 1;
  string tag = 2;
}
message InboundCompatibility {
  string instance_id = 1;
  uint64 generation = 2;
  InboundSummary inbound = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
}
