syntax = "proto3";
package papilio.xray.network.routing.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/network/routing/grpcapi/proto/v1;routingv1";
import "google/protobuf/timestamp.proto";

service RoutingService {
 rpc ListRoutingRules(ListRoutingRulesRequest) returns (RulePage);
 rpc TestRoute(TestRouteRequest) returns (RouteResult);
 rpc AddRoutingRule(AddRoutingRuleRequest) returns (RoutingOperation);
 rpc RemoveRoutingRule(RemoveRoutingRuleRequest) returns (RoutingOperation);
 rpc GetBalancerInfo(GetBalancerInfoRequest) returns (BalancerInfo);
 rpc OverrideBalancerTarget(OverrideBalancerTargetRequest) returns (RoutingOperation);
 rpc GetRoutingControlStatus(InstanceRequest) returns (RoutingControlStatus);
}
enum Network { NETWORK_UNKNOWN = 0; NETWORK_TCP = 2; NETWORK_UDP = 3; NETWORK_UNIX = 4; }
enum RuleMode { RULE_MODE_UNSPECIFIED = 0; RULE_MODE_APPEND = 1; RULE_MODE_REPLACE = 2; }
message RoutingContext {
 string inbound_tag = 1;
 Network network = 2;
 repeated string source_ips = 3;
 repeated string target_ips = 4;
 uint32 source_port = 5;
 uint32 target_port = 6;
 string target_domain = 7;
 string protocol = 8;
 string user = 9;
 map<string,string> attributes = 10;
 repeated string outbound_group_tags = 11;
 string outbound_tag = 12;
 repeated string local_ips = 13;
 uint32 local_port = 14;
 uint32 vless_route = 15;
}
message InstanceRequest { string instance_id = 1; }
message ListRoutingRulesRequest { string instance_id = 1; uint32 page_size = 2; string page_token = 3; }
message TestRouteRequest { string instance_id = 1; RoutingContext context = 2; repeated string field_selectors = 3; bool publish_result = 4; }
message AddRoutingRuleRequest { string instance_id = 1; bytes rule_json = 2; RuleMode mode = 3; bool confirm_destructive = 4; }
message RemoveRoutingRuleRequest { string instance_id = 1; string rule_tag = 2; }
message GetBalancerInfoRequest { string instance_id = 1; string balancer_tag = 2; }
message OverrideBalancerTargetRequest { string instance_id = 1; string balancer_tag = 2; optional string target = 3; }
message RoutingOperation {
 string instance_id = 1;
 string kind = 2;
 uint64 generation = 3;
 string effect = 4;
 bool acknowledged = 5;
 bool requires_instance_restart = 6;
 google.protobuf.Timestamp observed_at = 7;
 int64 duration_ns = 8;
}
message Observation { string instance_id = 1; uint64 generation = 2; google.protobuf.Timestamp observed_at = 3; int64 duration_ns = 4; string source = 5; }
// Route selection acknowledges native evaluation, not successful network traffic.
message RouteResult { RoutingOperation operation = 1; RoutingContext route = 2; bool traffic_verified = 3; }
message RoutingRule { string outbound_tag = 1; string rule_tag = 2; }
message RulePage {
 Observation observation = 1;
 repeated RoutingRule rules = 2;
 string observation_id = 3;
 string next_page_token = 4;
 google.protobuf.Timestamp expires_at = 5;
 google.protobuf.Timestamp served_at = 6;
 uint32 total = 7;
 bool fresh = 8;
}
message PrincipalTargets { repeated string tags = 1; }
message BalancerInfo { Observation observation = 1; string balancer_tag = 2; optional string override = 3; PrincipalTargets principal_targets = 4; }
message RoutingControlStatus {
 Observation observation = 1;
 string execution_state = 2;
 bool api_configured = 3;
 bool request_in_flight = 4;
 bool requires_instance_restart = 5;
 RoutingOperation last_operation = 6;
 string routing_stats_stream = 7;
}
