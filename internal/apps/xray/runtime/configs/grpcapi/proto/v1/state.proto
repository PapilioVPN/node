syntax = "proto3";
package papilio.xray.runtime.configs.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/runtime/configs/grpcapi/proto/v1;configsv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/xray/runtime/configs/grpcapi/proto/v1/compilation.proto";
import "internal/apps/xray/runtime/instances/grpcapi/proto/v1/types.proto";

message GetConfigurationRequest { string instance_id = 1; }
message ConfigurationMetadata {
  // Zero means no Node-owned source record; the operator baseline is selected.
  uint64 revision = 1;
  // Hashes original ordered source names and bytes, not compiled protobuf.
  string sha256 = 2;
  google.protobuf.Timestamp updated_at = 3;
  uint32 source_count = 4;
  bool durable = 5;
}
message ConfigurationStatus {
  string instance_id = 1;
  ConfigurationMetadata metadata = 2;
}
message DesiredConfiguration {
  string instance_id = 1;
  ConfigurationMetadata metadata = 2;
  // Includes original credentials. Only trusted management controllers may read.
  repeated ConfigurationSource sources = 3;
}
message ReplaceConfigurationRequest {
  string instance_id = 1;
  // Required presence; explicit zero creates the first desired revision.
  optional uint64 expected_revision = 2;
  repeated ConfigurationSource sources = 3;
}
message ApplyConfigurationRequest {
  string instance_id = 1;
  // Reapply this current revision without republishing. Each call may restart.
  optional uint64 expected_revision = 2;
}
message ConfigurationPersistence {
  ConfigurationMetadata metadata = 1;
  bool published = 2;
  bool publication_unknown = 3;
  bool durable = 4;
}
message ConfigurationChange {
  string instance_id = 1;
  // Persistence and execution are independent effects, not one atomic commit.
  ConfigurationPersistence persistence = 2;
  // Absent when execution was never attempted. Spawn does not prove readiness.
  papilio.core.engines.instances.v1.ControlResult execution = 3;
}

message PlanConfigurationRequest {
  string instance_id = 1;
  optional uint64 expected_revision = 2;
  repeated ConfigurationSource sources = 3;
}
message ConfigurationDifference {
  string section = 1;
  uint32 before_count = 2;
  uint32 after_count = 3;
}
// Preview contains neither source bytes, field values nor account material.
// No-op compares desired semantics; it does not reconcile separate live edits.
message ConfigurationPlan {
  string plan_id = 1;
  string instance_id = 2;
  uint64 expected_revision = 3;
  string previous_sha256 = 4;
  string candidate_sha256 = 5;
  string execution_id = 6;
  uint64 generation = 7;
  string mode = 8; // unchanged/live_routing/restart
  string reason = 9;
  repeated ConfigurationDifference differences = 10;
  bool connections_retained = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp expires_at = 13;
}
message ApplyConfigurationPlanRequest { string instance_id = 1; string plan_id = 2; }
message GetConfigurationApplicationRequest { string instance_id = 1; string application_id = 2; }
message RecoverConfigurationRequest {
  string instance_id = 1;
  string application_id = 2;
  optional uint64 expected_revision = 3;
  // New 32-character lowercase hex identity; exact replay reads its receipt.
  string recovery_id = 4;
}
message ConfigurationRecovery {
  string recovery_id = 1;
  uint64 expected_revision = 2;
  uint64 revision = 3;
  string outcome = 4;
  string engine_effect = 5;
  string readiness = 6;
  string error = 7;
  string execution_id = 8;
  uint64 generation = 9;
  ConfigurationPersistence persistence = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp completed_at = 12;
}
// Operational failures use this normal envelope. A missing reply never proves
// no effect: query application_id (the plan_id) or replay the SAME identity.
// Each new acceptance advances revision even when no engine change is required.
message ConfigurationApplication {
  string application_id = 1;
  string instance_id = 2;
  string epoch = 3;
  uint64 expected_revision = 4;
  uint64 revision = 5;
  uint64 previous_revision = 6;
  string candidate_sha256 = 7;
  string mode = 8;
  string outcome = 9;
  string phase = 10;
  string engine_effect = 11;
  bool acknowledged = 12;
  string readiness = 13; // API readiness, never payload traffic attestation.
  string error = 14;
  string execution_id = 15;
  uint64 generation = 16;
  ConfigurationPersistence persistence = 17;
  bool receipt_durable = 18;
  bool recovery_available = 19;
  bool requires_recovery = 20;
  google.protobuf.Timestamp started_at = 21;
  google.protobuf.Timestamp completed_at = 22;
  ConfigurationRecovery recovery = 23;
}
