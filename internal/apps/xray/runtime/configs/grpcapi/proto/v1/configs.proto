syntax = "proto3";
package papilio.xray.runtime.configs.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/runtime/configs/grpcapi/proto/v1;configsv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/xray/runtime/configs/grpcapi/proto/v1/compilation.proto";

import "internal/apps/xray/runtime/configs/grpcapi/proto/v1/state.proto";

service ConfigurationsService {
  rpc PlanConfiguration(PlanConfigurationRequest) returns (ConfigurationPlan);
  rpc ApplyConfigurationPlan(ApplyConfigurationPlanRequest) returns (ConfigurationApplication);
  rpc GetConfigurationApplication(GetConfigurationApplicationRequest) returns (ConfigurationApplication);
  rpc RecoverConfiguration(RecoverConfigurationRequest) returns (ConfigurationApplication);
  // Native config building only. It neither applies the candidate nor proves readiness.
  rpc ValidateConfiguration(ValidateConfigurationRequest) returns (ConfigurationValidation);
  // Builds ordered sources in one native conversion. Does not apply the result.
  rpc CompileConfiguration(CompileConfigurationRequest) returns (CompiledConfiguration);
  rpc GetConfigurationStatus(GetConfigurationRequest) returns (ConfigurationStatus);
  rpc GetConfiguration(GetConfigurationRequest) returns (DesiredConfiguration);
  // Validates, persists and restarts; failures may carry ConfigurationChange details.
  rpc ReplaceConfiguration(ReplaceConfigurationRequest) returns (ConfigurationChange);
  rpc ApplyConfiguration(ApplyConfigurationRequest) returns (ConfigurationChange);
}

message ValidateConfigurationRequest {
  string instance_id = 1;
  // json (including native comments), yaml, toml or protobuf.
  string format = 2;
  // Empty content is valid for the native default protobuf message.
  bytes content = 3;
}

message ConfigurationValidation {
  string instance_id = 1;
  bool valid = 2;
  google.protobuf.Timestamp checked_at = 3;
  int64 duration_ns = 4;
}
