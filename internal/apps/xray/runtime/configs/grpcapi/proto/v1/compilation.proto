syntax = "proto3";
package papilio.xray.runtime.configs.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/runtime/configs/grpcapi/proto/v1;configsv1";
import "google/protobuf/timestamp.proto";

message ConfigurationSource {
  // Native basename/extension. Names and source order affect native merging.
  string name = 1;
  bytes content = 2;
}
message CompileConfigurationRequest {
  string instance_id = 1;
  repeated ConfigurationSource sources = 2;
}
message CompiledConfiguration {
  string instance_id = 1;
  // Executable native protobuf, including any compiled credentials. Not debug JSON.
  // Native protobuf does not retain source-level environment settings.
  bytes content = 2;
  // Identifies content only, not a desired-state revision.
  string sha256 = 3;
  google.protobuf.Timestamp prepared_at = 4;
  int64 duration_ns = 5;
}
