syntax = "proto3";
package papilio.xray.runtime.statistics.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/runtime/statistics/grpcapi/proto/v1;statisticsv1";
import "google/protobuf/timestamp.proto";
service StatisticsService {
 rpc GetRuntimeStatistics(GetRuntimeStatisticsRequest) returns (RuntimeStatistics);
}
message GetRuntimeStatisticsRequest {string instance_id = 1;}
// Native configured-endpoint facts, not host/Node metrics or process attestation.
// The locally observed execution generation is stable across the native read.
message RuntimeStatistics {
 string instance_id = 1;
 uint64 generation = 2;
 uint32 goroutines = 3;
 uint32 gc_cycles = 4;
 uint64 heap_allocated_bytes = 5;
 uint64 heap_total_allocated_bytes = 6;
 // Native runtime.MemStats.Sys, not resident-set bytes.
 uint64 runtime_sys_bytes = 7;
 uint64 allocations = 8;
 uint64 frees = 9;
 uint64 live_objects = 10;
 uint64 gc_pause_total_ns = 11;
 // Starts at native StatsService construction; native uint32 semantics retained.
 uint32 api_uptime_seconds = 12;
 google.protobuf.Timestamp observed_at = 13;
 int64 duration_ns = 14;
}
