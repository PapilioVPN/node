syntax = "proto3";
package papilio.core.engines.instances.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/xray/runtime/instances/grpcapi/proto/v1;instancesv1";
import "google/protobuf/timestamp.proto";

message InstanceStatus {
 string instance_id = 1;
 string engine = 2;
 string state = 3;
 uint64 generation = 4;
 google.protobuf.Timestamp started_at = 5;
 google.protobuf.Timestamp exited_at = 6;
 optional int32 exit_code = 7;
 bool forced = 8;
 bool execution_failed = 9;
 google.protobuf.Timestamp observed_at = 10;
 // The original-source revision used by this execution, absent for operator baseline.
 optional uint64 configuration_revision = 11;
 bool configuration_cleanup_failed = 12;
}
message ControlResult {
 InstanceStatus status = 1;
 // completed, not_applied, partial or unknown. Lost replies never imply no effect.
 string effect = 2;
}
message InstanceReadiness {
 InstanceStatus status = 1;
 // API readiness observes the configured endpoint, not process identity or traffic.
 string api_state = 2;
 // This operation does not originate traffic; this value is not_checked.
 string traffic_state = 3;
 google.protobuf.Timestamp checked_at = 4;
}
