syntax = "proto3";
package papilio.system.host.processes.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/processes/grpcapi/proto/v1;processesv1";
import "google/protobuf/timestamp.proto";

// Processes visible in Node's PID namespace. Host scope in Docker requires
// explicit --pid=host. No namespace switch or privilege elevation is performed.
service HostProcessesService {
  rpc CountProcesses(CountProcessesRequest) returns (CountProcessesResponse);
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
}
message CountProcessesRequest {}
message CountProcessesResponse {
  // Visible process leaders, not task/thread count; no per-process stat reads.
  uint64 count = 1;
  google.protobuf.Timestamp observed_at = 2;
  int64 duration_ns = 3;
}
message GetProcessRequest { int32 pid = 1; }
message GetProcessResponse {
  Process process = 1;
  uint64 ticks_per_second = 2;
  google.protobuf.Timestamp observed_at = 3;
  int64 duration_ns = 4;
}
message ListProcessesRequest {
  // Exclusive PID cursor. Each page observes current PIDs, not a stable snapshot.
  int32 after_pid = 1;
  // Zero selects 128. Maximum 256.
  uint32 limit = 2;
}
message ListProcessesResponse {
  // Ascending PID. Each enumerated PID has a process or an explicit issue.
  repeated ProcessEntry entries = 1;
  optional int32 next_after_pid = 2;
  uint64 ticks_per_second = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
}
message ProcessEntry {
  int32 pid = 1;
  Process process = 2;
  // Empty on success; not_found, permission_denied or unavailable otherwise.
  string issue = 3;
}
// One native stat read. PID + start_ticks identifies reuse within a boot and
// namespace. Memory is an approximate kernel observation, not cgroup accounting.
message Process {
  int32 pid = 1;
  int32 parent_pid = 2;
  string name = 3;
  string state = 4;
  uint32 threads = 5;
  int32 priority = 6;
  int32 nice = 7;
  uint64 start_ticks = 8;
  uint64 user_ticks = 9;
  uint64 system_ticks = 10;
  uint64 virtual_bytes = 11;
  uint64 resident_bytes = 12;
}
