syntax = "proto3";

package papilio.system.host.identity.v1;

option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/identity/grpcapi/proto/v1;identityv1";

import "google/protobuf/timestamp.proto";

service HostIdentityService {
  rpc GetHostIdentity(GetHostIdentityRequest) returns (GetHostIdentityResponse);
}

message GetHostIdentityRequest {}

message HostIdentity {
  string hostname = 1;
  string operating_system = 2;
  string release = 3;
  string version = 4;
  string machine = 5;
}

message GetHostIdentityResponse {
  HostIdentity identity = 1;
  google.protobuf.Timestamp observed_at = 2;
  int64 duration_ns = 3;
}
