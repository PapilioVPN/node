syntax = "proto3";
package papilio.system.host.cpu.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/cpu/grpcapi/proto/v1;cpuv1";
import "google/protobuf/timestamp.proto";
message GetHostCPUFrequencyRequest {}

// One Linux CPUFreq policy, not one independent reading per related CPU.
// Attributes are non-atomic. Scaling current frequency is a driver report and
// need not equal the actual hardware frequency. All frequency values use kHz.
message FrequencyPolicy {
  uint32 id = 1;
  repeated uint32 related_cpus = 2;
  repeated uint32 affected_cpus = 3;
  optional uint64 hardware_current_khz = 4;
  optional uint64 hardware_average_khz = 5;
  optional uint64 hardware_min_khz = 6;
  optional uint64 hardware_max_khz = 7;
  optional uint64 scaling_current_khz = 8;
  optional uint64 scaling_min_khz = 9;
  optional uint64 scaling_max_khz = 10;
  optional uint64 transition_latency_ns = 11;
  optional string driver = 12;
  optional string governor = 13;
  repeated string available_governors = 14;
  repeated uint64 available_khz = 15;
  repeated FrequencyAttributeUnavailable unavailable = 16;
}

message FrequencyAttributeUnavailable {
  string attribute = 1;
  // not_present, permission_denied or temporarily_unavailable.
  string reason = 2;
}

message GetHostCPUFrequencyResponse {
  bool interface_present = 1;
  repeated FrequencyPolicy policies = 2;
  google.protobuf.Timestamp observed_at = 3;
  int64 duration_ns = 4;
}
