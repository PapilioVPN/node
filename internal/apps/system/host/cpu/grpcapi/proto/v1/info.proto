syntax = "proto3";
package papilio.system.host.cpu.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/cpu/grpcapi/proto/v1;cpuv1";
import "google/protobuf/timestamp.proto";

message GetHostCPUInfoRequest {}

message ProcessorInfo {
  uint32 id = 1;
  optional string vendor_id = 2;
  optional string family = 3;
  optional string model = 4;
  optional string model_name = 5;
  optional string stepping = 6;
  optional string microcode = 7;
  optional int32 package_id = 8;
  optional int32 core_id = 9;
  optional uint32 reported_cores = 10;
  optional uint32 reported_siblings = 11;
  // The cpuinfo reading; this is neither a minimum nor maximum frequency.
  optional double reported_mhz = 12;
  optional uint64 cache_bytes = 13;
  // Ordered kernel reports, not an assertion that unreported features are absent.
  repeated string reported_features = 14;
  repeated string reported_bugs = 15;
}

message GetHostCPUInfoResponse {
  uint32 logical_count = 1;
  // Observed OS packages, not a guarantee of physical mechanical socket count.
  optional uint32 package_count = 2;
  // Sum of consistent reported core counts in observed packages; otherwise absent.
  optional uint32 physical_core_count = 3;
  repeated ProcessorInfo processors = 4;
  google.protobuf.Timestamp observed_at = 5;
  int64 duration_ns = 6;
}
