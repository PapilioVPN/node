syntax = "proto3";
package papilio.system.host.cpu.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/cpu/grpcapi/proto/v1;cpuv1";
import "google/protobuf/timestamp.proto";

message GetHostCPUUsageRequest {
  bool per_cpu = 1;
  // Omitted defaults to 100 ms. Explicit values must be positive.
  // The common operation deadline bounds the entire sample, including its wait.
  optional int64 interval_ns = 2;
}

enum CPUUsageState {
  CPU_USAGE_STATE_UNSPECIFIED = 0;
  CPU_USAGE_STATE_MEASURED = 1;
  CPU_USAGE_STATE_NO_PROGRESS = 2;
  CPU_USAGE_STATE_COUNTER_DECREASED = 3;
  CPU_USAGE_STATE_COUNTER_OVERFLOW = 4;
  CPU_USAGE_STATE_ADDED = 5;
  CPU_USAGE_STATE_REMOVED = 6;
}

message CPUUsage {
  string cpu = 1;
  CPUUsageState state = 2;
  // Present only for a valid window. Measured idle usage is present zero.
  optional double percent = 3;
  optional uint64 busy_ticks = 4;
  optional uint64 total_ticks = 5;
}

message GetHostCPUUsageResponse {
  bool per_cpu = 1;
  uint64 ticks_per_second = 2;
  // Final native order, followed by removed CPUs in initial order.
  repeated CPUUsage cpus = 3;
  int64 requested_interval_ns = 4;
  // Read-completion boundaries, not an atomic snapshot across all processors.
  google.protobuf.Timestamp started_at = 5;
  int64 sample_interval_ns = 6;
  google.protobuf.Timestamp observed_at = 7;
  int64 duration_ns = 8;
}
