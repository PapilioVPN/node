syntax = "proto3";
package papilio.system.host.sensors.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/sensors/grpcapi/proto/v1;sensorsv1";
import "google/protobuf/timestamp.proto";
message PowerSupply {
 string id = 1;
 string type = 2;
 optional string status = 3;
 optional bool present = 4;
 optional bool online = 5;
 optional uint32 capacity_percent = 6;
 optional uint64 energy_now_micro_wh = 7;
 optional uint64 energy_full_micro_wh = 8;
 optional uint64 charge_now_micro_ah = 9;
 optional uint64 charge_full_micro_ah = 10;
 optional int64 power_micro_w = 11;
 optional int64 current_micro_a = 12;
 optional uint64 voltage_micro_v = 13;
 optional uint64 time_to_empty_seconds = 14;
 optional uint64 time_to_full_seconds = 15;
}
message GetPowerSuppliesRequest {}
message GetPowerSuppliesResponse {
 repeated PowerSupply readings = 1;
 google.protobuf.Timestamp observed_at = 2;
 int64 duration_ns = 3;
}
