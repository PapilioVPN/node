syntax = "proto3";
package papilio.system.host.sensors.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/sensors/grpcapi/proto/v1;sensorsv1";
import "google/protobuf/timestamp.proto";
message Temperature {
 string id = 1;
 string device = 2;
 optional string label = 3;
 int64 milli_celsius = 4;
 optional int64 high_milli_celsius = 5;
 optional int64 critical_milli_celsius = 6;
}
message GetTemperaturesRequest {}
message GetTemperaturesResponse {
 repeated Temperature readings = 1;
 google.protobuf.Timestamp observed_at = 2;
 int64 duration_ns = 3;
}
