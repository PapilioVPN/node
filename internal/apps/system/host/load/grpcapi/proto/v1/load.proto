syntax = "proto3";

package papilio.system.host.load.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/load/grpcapi/proto/v1;loadv1";

import "google/protobuf/timestamp.proto";

service HostLoadService {
  rpc GetHostLoad(GetHostLoadRequest) returns (GetHostLoadResponse);
}

message GetHostLoadRequest {}

message GetHostLoadResponse {
  // System-wide runnable/uninterruptible task averages, not CPU percentages.
  double one_minute = 1;
  double five_minutes = 2;
  double fifteen_minutes = 3;
  google.protobuf.Timestamp observed_at = 4;
  int64 duration_ns = 5;
}
