syntax = "proto3";
package papilio.system.host.sessions.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/sessions/grpcapi/proto/v1;sessionsv1";
import "internal/apps/system/host/sessions/grpcapi/proto/v1/summary.proto";
import "google/protobuf/timestamp.proto";
message GetSessionRequest {string id = 1;}
message GetSessionResponse {
 SessionDetails session = 1;
 google.protobuf.Timestamp observed_at = 2;
 int64 duration_ns = 3;
}
// A targeted native GetSession + GetAll, without listing other sessions.
message SessionDetails {
 SessionSummary summary = 1;
 optional bool remote = 2;
 optional string remote_host = 3;
 optional string remote_user = 4;
 optional uint64 started_unix_us = 5;
 optional uint64 started_monotonic_us = 6;
 optional string type = 7;
 optional string state = 8;
 optional bool active = 9;
}
