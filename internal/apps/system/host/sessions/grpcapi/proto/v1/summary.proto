syntax = "proto3";
package papilio.system.host.sessions.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/sessions/grpcapi/proto/v1;sessionsv1";
// Native logind bulk projection. Absent optional fields are not reported by
// older ListSessions; present-zero and present-empty retain their meaning.
message SessionSummary {
 string id = 1;
 uint32 uid = 2;
 string user = 3;
 string seat = 4;
 optional uint32 leader_pid = 5;
 optional string class = 6;
 optional string terminal = 7;
 optional bool idle = 8;
 optional uint64 idle_since_monotonic_us = 9;
}
