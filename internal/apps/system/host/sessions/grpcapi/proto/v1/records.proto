syntax = "proto3";
package papilio.system.host.sessions.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/host/sessions/grpcapi/proto/v1;sessionsv1";
import "google/protobuf/timestamp.proto";
message ListLoginRecordsRequest {
 uint32 offset = 1;
 // Zero defaults to 128; maximum 256. Offset must not exceed 16384.
 uint32 limit = 2;
}
// Legacy file order/duplicates are preserved. Pages re-read the current file;
// this is not a stable cross-page snapshot. Missing source is an error, not an
// empty inventory. The legacy binary ABI is currently verified for Linux amd64.
message ListLoginRecordsResponse {
 repeated LoginRecord records = 1;
 optional uint32 next_offset = 2;
 google.protobuf.Timestamp observed_at = 3;
 int64 duration_ns = 4;
}
message LoginRecord {
 int32 pid = 1;
 // Native utmp record identifier, not a logind session ID.
 string record_id = 2;
 string user = 3;
 string terminal = 4;
 string host = 5;
 int64 started_unix_us = 6;
 int32 session_id = 7;
}
