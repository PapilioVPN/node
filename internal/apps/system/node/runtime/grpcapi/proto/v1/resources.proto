syntax = "proto3";
package papilio.system.node.runtime.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/node/runtime/grpcapi/proto/v1;runtimev1";
import "google/protobuf/timestamp.proto";
message GetNodeResourcesRequest {}
message GetNodeResourcesResponse{
 int32 pid = 1;
 uint64 start_ticks = 2;
 uint64 ticks_per_second = 3;
 uint64 user_ticks = 4;
 uint64 system_ticks = 5;
 uint64 virtual_bytes = 6;
 uint64 resident_bytes = 7;
 uint64 threads = 8;
 uint64 file_descriptors = 9;
 uint64 goroutines = 10;
 uint64 go_max_procs = 11;
 uint64 runtime_mapped_bytes = 12;
 uint64 heap_objects_bytes = 13;
 uint64 heap_released_bytes = 14;
 uint64 allocated_bytes = 15;
 uint64 freed_bytes = 16;
 uint64 gc_cycles = 17;
 google.protobuf.Timestamp observed_at = 18;
 int64 duration_ns = 19;
}
