syntax = "proto3";
package papilio.system.node.runtime.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/node/runtime/grpcapi/proto/v1;runtimev1";
import "google/protobuf/timestamp.proto";
message GetNodeInfoRequest {}
message GetNodeInfoResponse{
 string go_version = 1;
 string compiler = 2;
 string operating_system = 3;
 string architecture = 4;
 string executable = 5;
 int32 pid = 6;
 int32 parent_pid = 7;
 google.protobuf.Timestamp initialized_at = 8;
 string module_path = 9;
 string module_version = 10;
 optional string revision = 11;
 optional string revision_time = 12;
 optional bool modified = 13;
 google.protobuf.Timestamp observed_at = 14;
 int64 duration_ns = 15;
}
