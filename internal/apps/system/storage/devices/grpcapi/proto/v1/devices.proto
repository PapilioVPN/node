syntax = "proto3";
package papilio.system.storage.devices.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/storage/devices/grpcapi/proto/v1;devicesv1";
import "google/protobuf/timestamp.proto";
service DeviceIOService {rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);}
message ListDevicesRequest {
 // Exclusive lexical device-name cursor, maximum 255 UTF-8 bytes.
 string after_name = 1;
 // Zero defaults to 128; maximum 256.
 uint32 limit = 2;
}
// Kernel-wide block-device/partition counters, not cgroup usage. Pages re-observe
// current devices; hotplug/reset and traversal are not an atomic snapshot.
message ListDevicesResponse {
 repeated Device devices = 1;
 optional string next_after_name = 2;
 uint32 sector_size_bytes = 3;
 google.protobuf.Timestamp observed_at = 4;
 int64 duration_ns = 5;
}
message Device {
 uint32 major = 1;
 uint32 minor = 2;
 string name = 3;
 // Sector counters use 512-byte units independently of hardware sector size.
 uint64 reads_completed = 4;
 uint64 reads_merged = 5;
 uint64 read_sectors = 6;
 uint64 read_milliseconds = 7;
 uint64 writes_completed = 8;
 uint64 writes_merged = 9;
 uint64 write_sectors = 10;
 uint64 write_milliseconds = 11;
 uint64 in_progress = 12;
 uint64 active_milliseconds = 13;
 uint64 weighted_milliseconds = 14;

 // Absent means the native kernel layout does not report these counters.
 Discard discard = 15;
 Flush flush = 16;
}
message Discard {uint64 completed = 1;uint64 merged = 2;uint64 sectors = 3;uint64 milliseconds = 4;}
message Flush {uint64 completed = 1;uint64 milliseconds = 2;}
