syntax = "proto3";
package papilio.system.network.interfaces.v1;
option go_package = "github.com/PapilioVPN/node/internal/apps/system/network/interfaces/grpcapi/proto/v1;interfacesv1";
import "google/protobuf/timestamp.proto";
import "internal/apps/system/network/interfaces/grpcapi/proto/v1/counters.proto";

service InterfacesService {
  rpc ListInterfaces(ListInterfacesRequest) returns (ListInterfacesResponse);
  rpc GetInterfaceCounters(GetInterfaceCountersRequest) returns (GetInterfaceCountersResponse);
}
message ListInterfacesRequest {}

// Interface indices/flags belong to the current network namespace. Index/name
// can be reused after removal. Operational state is Linux IF_OPER_* (0=unknown).
message Interface {
  uint32 index = 1;
  string name = 2;
  string kind = 3;
  uint32 mtu = 4;
  string hardware_address = 5;
  uint32 flags = 6;
  uint32 operational_state = 7;
  uint32 parent_index = 8;
  uint32 master_index = 9;
  repeated Address addresses = 10;
  // Parent indices can belong to peer namespaces; absent means unreported.
  optional int32 parent_namespace_id = 11;
}

message Address {
  uint32 interface_index = 1;
  string family = 2;
  string local_prefix = 3;
  optional string peer_prefix = 4;
  optional string broadcast = 5;
  string label = 6;
  uint32 flags = 7;
  uint32 scope = 8;
  uint32 preferred_lifetime_seconds = 9;
  uint32 valid_lifetime_seconds = 10;
}

// Separate link/address dumps are not atomic. Addresses without a matching
// earlier link remain explicit. Lifetime seconds use MaxUint32 for unlimited.
message ListInterfacesResponse {
  repeated Interface interfaces = 1;
  repeated Address unmatched_addresses = 2;
  google.protobuf.Timestamp observed_at = 3;
  int64 duration_ns = 4;
}
