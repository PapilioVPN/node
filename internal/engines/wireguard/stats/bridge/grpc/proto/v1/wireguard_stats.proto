syntax = "proto3";

package papiliovpn.node.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PapilioVPN/node/internal/engines/wireguard/stats/bridge/grpc/proto/v1;statsv1";

service WireGuardStatsService {
  rpc GetInterfaceTraffic(WireGuardInterfaceTrafficRequest) returns (WireGuardInterfaceTraffic);
  rpc GetPeerTraffic(WireGuardPeerTrafficRequest) returns (WireGuardPeerTraffic);
  rpc ResetPeerTraffic(WireGuardPeerTrafficRequest) returns (WireGuardPeerTraffic);
  rpc GetInterfaceUsage(WireGuardInterfaceTrafficRequest) returns (WireGuardInterfaceUsage);
  rpc ResetInterfaceUsage(WireGuardInterfaceTrafficRequest) returns (WireGuardInterfaceUsage);
  rpc GetPeerUsage(WireGuardPeerTrafficRequest) returns (WireGuardPeerUsage);
  rpc ResetPeerUsage(WireGuardPeerTrafficRequest) returns (WireGuardPeerUsage);
  rpc ListPeerUsage(WireGuardInterfaceTrafficRequest) returns (WireGuardPeerUsageList);
  rpc ResetAllPeerUsage(WireGuardInterfaceTrafficRequest) returns (WireGuardPeerUsageList);
}

message WireGuardInterfaceTrafficRequest {
  string name = 1;
}

message WireGuardInterfaceTraffic {
  // Live kernel link counters in bytes, scoped to the current link lifetime.
  uint64 rx_bytes = 1;
  uint64 tx_bytes = 2;
}

message WireGuardPeerTrafficRequest {
  string name = 1;
  bytes public_key = 2;
}

message WireGuardPeerTraffic {
  // Bytes since the latest logical reset in this Node process, or since the
  // current peer was created. ResetPeerTraffic returns the preceding period.
  uint64 rx_bytes = 1;
  uint64 tx_bytes = 2;
}

message WireGuardInterfaceUsage {
  // Bytes since the first successful usage read or most recent logical reset.
  // ResetInterfaceUsage returns the preceding period.
  uint64 rx_bytes = 1;
  uint64 tx_bytes = 2;
}

message WireGuardUsageRow {
  bytes public_key = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
}

message WireGuardPeerUsage {
  // Omitted when the peer has no unreported usage.
  WireGuardUsageRow peer = 1;
  google.protobuf.Timestamp sampled_at = 2;
  bool incomplete = 3;
}

message WireGuardPeerUsageList {
  // Unreported usage keyed by public key, including retired peers.
  repeated WireGuardUsageRow peers = 1;
  google.protobuf.Timestamp sampled_at = 2;
  bool incomplete = 3;
}
