syntax = "proto3";

package papiliovpn.node.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/PapilioVPN/node/internal/engines/wireguard/interfaces/bridge/grpc/proto/v1;interfacesv1";

service WireGuardInterfacesService {
  rpc GetStatus(WireGuardInterfaceRequest) returns (WireGuardInterfaceStatus);
  rpc Start(WireGuardStartRequest) returns (WireGuardInterfaceStatus);
  rpc Stop(WireGuardInterfaceRequest) returns (WireGuardStopResponse);
  rpc ValidateConfig(WireGuardValidateConfigRequest) returns (WireGuardConfigValidation);
  rpc SyncPeers(WireGuardSyncPeersRequest) returns (WireGuardPeerSyncResult);
  rpc UpsertPeer(WireGuardUpsertPeerRequest) returns (WireGuardPeerSyncResult);
  rpc RemovePeer(WireGuardRemovePeerRequest) returns (WireGuardRemovePeerResponse);
  rpc ApplyPeerDelta(WireGuardApplyPeerDeltaRequest) returns (WireGuardPeerSyncResult);
  rpc ListPeerStats(WireGuardInterfaceRequest) returns (WireGuardPeerStatsList);
  rpc ListPeers(WireGuardInterfaceRequest) returns (WireGuardPeerMembership);
}

message WireGuardPeerMember {
  bytes public_key = 1;
  repeated string allowed_ips = 2;
}

message WireGuardPeerMembership {
  repeated WireGuardPeerMember peers = 1;
}

message WireGuardInterfaceRequest {
  string name = 1;
  // GetStatus only. Read the effective device configuration from the kernel.
  bool include_configuration = 2;
}

message WireGuardInterfaceStatus {
  string name = 1;
  uint32 mtu = 2;
  // Linux IFF_UP. It describes administrative state.
  bool up = 3;
  optional string applied_config_sha256 = 4;
  WireGuardInterfaceConfiguration configuration = 5;
}

message WireGuardInterfaceConfiguration {
  bytes public_key = 1;
  uint32 listen_port = 2;
  repeated string addresses = 3;
}

message WireGuardStartRequest {
  string name = 1;
  bytes config_json = 2;
}

message WireGuardStopResponse {}

message WireGuardValidateConfigRequest {
  string name = 1;
  bytes config_json = 2;
}

message WireGuardConfigValidation {
  bool valid = 1;
  WireGuardConfigIssue issue = 2;
}

enum WireGuardConfigIssue {
  WIRE_GUARD_CONFIG_ISSUE_UNSPECIFIED = 0;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_JSON = 1;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_PRIVATE_KEY = 2;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_ADDRESSES = 3;
  WIRE_GUARD_CONFIG_ISSUE_DUPLICATE_ADDRESS = 4;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_MTU = 5;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_LISTEN_PORT = 6;
  WIRE_GUARD_CONFIG_ISSUE_INVALID_INITIAL_PEERS = 7;
}

message WireGuardPeer {
  bytes public_key = 1;
  repeated string allowed_ips = 2;
  bytes preshared_key = 3;
}

message WireGuardPeerSet {
  repeated WireGuardPeer peers = 1;
}

message WireGuardSyncPeersRequest {
  string name = 1;
  // Presence is required. A present empty set removes all peers.
  WireGuardPeerSet desired = 2;
  // Read the current kernel peer set before applying the desired set.
  bool reconcile = 3;
}

message WireGuardPeerSyncResult {
  uint32 added = 1;
  uint32 updated = 2;
  uint32 removed = 3;
}

message WireGuardUpsertPeerRequest {
  string name = 1;
  WireGuardPeer peer = 2;
}

message WireGuardRemovePeerRequest {
  string name = 1;
  bytes public_key = 2;
}

message WireGuardRemovePeerResponse {}

message WireGuardApplyPeerDeltaRequest {
  string name = 1;
  repeated WireGuardPeer upsert = 2;
  repeated bytes remove = 3;
}

message WireGuardPeerStats {
  bytes public_key = 1;
  uint64 rx_bytes = 2;
  uint64 tx_bytes = 3;
  // Absent until the peer has completed a handshake.
  google.protobuf.Timestamp last_handshake = 4;
}

message WireGuardPeerStatsList {
  repeated WireGuardPeerStats peers = 1;
}
