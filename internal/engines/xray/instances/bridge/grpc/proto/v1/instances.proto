syntax = "proto3";

package papiliovpn.node.v1;

option go_package = "github.com/PapilioVPN/node/internal/engines/xray/instances/bridge/grpc/proto/v1;instancesv1";

service XrayInstancesService {
  // Starts the configured instance and waits for its native API to respond.
  // Start failures have XrayStartFailure details on an UNAVAILABLE status.
  rpc Start(XrayInstanceRequest) returns (XrayInstanceStatus);
  // Returns the last state observed by the lifecycle owner.
  rpc GetStatus(XrayInstanceRequest) returns (XrayInstanceStatus);
  // Stops and reaps the instance before returning success.
  rpc Stop(XrayInstanceRequest) returns (XrayInstanceStatus);
}

message XrayInstanceRequest {
  string id = 1;
}

enum XrayInstanceState {
  XRAY_INSTANCE_STATE_UNSPECIFIED = 0;
  XRAY_INSTANCE_STATE_STOPPED = 1;
  XRAY_INSTANCE_STATE_STARTING = 2;
  XRAY_INSTANCE_STATE_READY = 3;
  XRAY_INSTANCE_STATE_STOPPING = 4;
  XRAY_INSTANCE_STATE_FAILED = 5;
}

message XrayInstanceStatus {
  string id = 1;
  XrayInstanceState state = 2;
  // Version reported by the executable for the current child, when available.
  string xray_version = 3;
  string node_version = 4;
}

enum XrayStartFailureReason {
  XRAY_START_FAILURE_REASON_UNSPECIFIED = 0;
  XRAY_START_FAILURE_REASON_LAUNCH_FAILED = 1;
  XRAY_START_FAILURE_REASON_EXITED_BEFORE_READY = 2;
  XRAY_START_FAILURE_REASON_READINESS_TIMEOUT = 3;
  XRAY_START_FAILURE_REASON_READINESS_FAILED = 4;
}

message XrayStartFailure {
  XrayStartFailureReason reason = 1;
  // Present when Xray exited normally before readiness and reported a code.
  optional int32 exit_code = 2;
}
