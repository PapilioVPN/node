syntax = "proto3";

package papiliovpn.xray.native;
option go_package = "github.com/PapilioVPN/node/internal/engines/xray/routing/native";

// Wire projections for Xray v26.11.9. The native Go module requires a
// newer toolchain than Node's build pin.
// https://github.com/XTLS/Xray-core/blob/676eaf66f8f05d4d558ee7a74b4736623d3feeb9/app/router/command/command.proto
message ListRuleResponse {
  repeated ListRuleItem rules = 1;
}

message ListRuleItem {
  string outbound_tag = 1;
  string rule_tag = 2;
}

message GetBalancerInfoRequest {
  string tag = 1;
}

message GetBalancerInfoResponse {
  Balancer balancer = 1;
}

message Balancer {
  Override override = 5;
  Targets principle_target = 6;
}

message Override {
  string target = 2;
}

message Targets {
  repeated string tags = 1;
}

// Wire projection of the probe context and the selected outbound fields.
message RouteContext {
  string inbound_tag = 1;
  int32 network = 2;
  repeated bytes target_ips = 4;
  uint32 target_port = 6;
  string target_domain = 7;
  string protocol = 8;
  string user = 9;
  map<string, string> attributes = 10;
  repeated string outbound_group_tags = 11;
  string outbound_tag = 12;
}

message TestRouteRequest {
  RouteContext routing_context = 1;
  repeated string field_selectors = 2;
}

message OverrideBalancerTargetRequest {
  string balancer_tag = 1;
  string target = 2;
}
