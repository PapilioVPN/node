syntax = "proto3";

package papiliovpn.node.v1;

import "google/protobuf/empty.proto";
option go_package = "github.com/PapilioVPN/node/internal/engines/xray/routing/bridge/grpc/proto/v1;routingv1";

message XrayRoutingRulesRequest {
  string id = 1;
}

message XrayRoutingRule {
  // Xray's reported destination tag. It can be empty for a balancer rule.
  string outbound_tag = 1;
  string rule_tag = 2;
}

message XrayRoutingRules {
  // Preserves the native rule order, including empty and repeated tags.
  repeated XrayRoutingRule rules = 1;
}

message XrayBalancerInfoRequest {
  string id = 1;
  string tag = 2;
}

message XrayBalancerTargets {
  repeated string tags = 1;
}

message XrayBalancerInfo {
  // An explicitly empty value means the router supports overrides and none is set.
  optional string override_target = 1;
  // Present when Xray reports a strategy result, even if it has no targets.
  XrayBalancerTargets reported_targets = 2;
}

message XrayTestRouteRequest {
  string id = 1;
  string inbound_tag = 2;
  string network = 3;
  string target_ip = 4;
  string target_domain = 5;
  uint32 target_port = 6;
  string protocol = 7;
  string user = 8;
  map<string, string> attributes = 9;
}

message XrayRouteSelection {
  string outbound_tag = 1;
  repeated string outbound_group_tags = 2;
}

message XrayOverrideBalancerTargetRequest {
  string id = 1;
  string tag = 2;
  // Supply an empty string to clear the override.
  optional string target = 3;
}

enum XrayRoutingRuleMode {
  XRAY_ROUTING_RULE_MODE_UNSPECIFIED = 0;
  XRAY_ROUTING_RULE_MODE_APPEND = 1;
  XRAY_ROUTING_RULE_MODE_REPLACE = 2;
}

message XrayAddRoutingRuleRequest {
  string id = 1;
  // One native routing.rules[] JSON object.
  bytes rule_json = 2;
  XrayRoutingRuleMode mode = 3;
  // Required to replace the entire active rule and balancer sets.
  bool confirm_replace = 4;
}

message XrayRemoveRoutingRuleRequest {
  string id = 1;
  string rule_tag = 2;
}

service XrayRoutingService {
  rpc ListRoutingRules(XrayRoutingRulesRequest) returns (XrayRoutingRules);
  rpc GetBalancerInfo(XrayBalancerInfoRequest) returns (XrayBalancerInfo);
  rpc TestRoute(XrayTestRouteRequest) returns (XrayRouteSelection);
  rpc OverrideBalancerTarget(XrayOverrideBalancerTargetRequest) returns (google.protobuf.Empty);
  rpc AddRoutingRule(XrayAddRoutingRuleRequest) returns (google.protobuf.Empty);
  rpc RemoveRoutingRule(XrayRemoveRoutingRuleRequest) returns (google.protobuf.Empty);
}
