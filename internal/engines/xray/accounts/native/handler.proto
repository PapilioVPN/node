syntax = "proto3";

package papiliovpn.node.xray.accounts.native;
option go_package = "github.com/PapilioVPN/node/internal/engines/xray/accounts/native";

// Wire projections of Xray v26.11.9's HandlerService, core and VLESS schemas.
message TypedMessage {
  string type = 1;
  bytes value = 2;
}

message User {
  uint32 level = 1;
  string email = 2;
  TypedMessage account = 3;
}

message VlessAccount {
  string id = 1;
  string flow = 2;
}

message VlessInbound {
  repeated User users = 1;
}

message AlterInboundRequest {
  string tag = 1;
  TypedMessage operation = 2;
}

message AddUserOperation {
  User user = 1;
}

message RemoveUserOperation {
  string email = 1;
}

message ListInboundsRequest {
  bool is_only_tags = 1;
}

message ListInboundsResponse {
  repeated Inbound inbounds = 1;
}

message Inbound {
  string tag = 1;
  TypedMessage proxy_settings = 3;
}

message GetInboundUserRequest {
  string tag = 1;
}

message GetInboundUsersCountResponse {
  int64 count = 1;
}

message PasswordAccount {
  string password = 1;
}

message ShadowsocksAccount {
  string password = 1;
  uint32 cipher_type = 2;
}

message WireGuardAccount {
  string public_key = 1;
  string pre_shared_key = 2;
  string keep_alive = 4;
  repeated string allowed_ips = 5;
}

message GetInboundUserResponse {
  repeated User users = 1;
}
