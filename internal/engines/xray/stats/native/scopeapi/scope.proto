syntax = "proto3";

package papiliovpn.xray.scope.v1;
option go_package = "github.com/PapilioVPN/node/internal/engines/xray/stats/native/scopeapi";

service ExactTraffic {
  rpc ResetScope(ScopeResetRequest) returns (ScopeResetResult);
  rpc ResetPair(PairResetRequest) returns (PairResetResult);
}

message Config {}

message ScopeResetRequest {
  string scope = 1;
  uint32 max_counters = 2;
}

message ScopeResetResult {
  repeated Counter counters = 1;
  // The bound was exceeded before any write. Counters is then empty.
  bool limit_exceeded = 2;
}

message Counter {
  string name = 1;
  bool downlink = 2;
  int64 previous_bytes = 3;
}

message PairResetRequest {
  string scope = 1;
  string name = 2;
}

message PairResetResult {
  // An absent value means the direction had no registered counter.
  optional int64 previous_uplink = 1;
  optional int64 previous_downlink = 2;
}
