syntax = "proto3";

package papiliovpn.node.v1;
option go_package = "github.com/PapilioVPN/node/internal/engines/xray/stats/bridge/grpc/proto/v1;statsv1";

import "proto/v1/traffic.proto";
import "proto/v1/online.proto";

service XrayStatsService {
  // Reads runtime statistics from the active Xray instance.
  rpc GetRuntimeStats(XrayRuntimeStatsRequest) returns (XrayRuntimeStats);
  rpc GetTraffic(XrayTrafficRequest) returns (XrayTrafficUsage);
  rpc ListTraffic(XrayTrafficListRequest) returns (XrayTrafficList);
  rpc ResetTrafficCounter(XrayTrafficResetRequest) returns (XrayTrafficResetResult);
  rpc ResetTrafficPair(XrayTrafficPairResetRequest) returns (XrayTrafficPairResetResult);
  rpc ResetTrafficScope(XrayTrafficScopeResetRequest) returns (XrayTrafficScopeResetResult);
  rpc GetOnlineIPCount(XrayOnlineRequest) returns (XrayOnlineCount);
  rpc ListOnlineIPs(XrayOnlineRequest) returns (XrayOnlineIPs);
  rpc ListOnlineUsers(XrayOnlineUsersRequest) returns (XrayOnlineUsers);
}

message XrayRuntimeStatsRequest {
  string id = 1;
}

message XrayRuntimeStats {
  uint32 goroutines = 1;
  uint32 gc_count = 2;
  uint64 heap_allocated_bytes = 3;
  uint64 total_allocated_bytes = 4;
  uint64 system_bytes = 5;
  uint64 mallocs = 6;
  uint64 frees = 7;
  uint64 live_objects = 8;
  uint64 gc_pause_total_nanoseconds = 9;
  uint32 uptime_seconds = 10;
}
