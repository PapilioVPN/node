name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Prepare Xray integration fixture
        run: |
          fixture="$RUNNER_TEMP/node-xray"
          mkdir -p "$fixture"
          curl --fail --location --retry 3 --output "$fixture/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip
          printf '%s  %s\n' b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82 "$fixture/xray.zip" | sha256sum -c
          unzip -q "$fixture/xray.zip" xray -d "$fixture"
          chmod +x "$fixture/xray"
          printf 'NODE_TEST_XRAY=%s\n' "$fixture/xray" >> "$GITHUB_ENV"
      - name: Check Hysteria integration in an isolated network
        run: |
          fixture=$(mktemp -d "$RUNNER_TEMP/node-hysteria.XXXXXX")
          curl --fail --location --retry 3 --output "$fixture/hysteria" \
            https://github.com/HyNetworks/hysteria/releases/download/app/v2.14.0/hysteria-linux-amd64
          printf '%s  %s\n' fc25edff9948708cb00a4ff01f3bccde677660aca050133bb1ad46c6860362d2 "$fixture/hysteria" | sha256sum -c
          chmod +x "$fixture/hysteria"
          go test -race -c -o "$fixture/engine.test" ./internal/engines/hysteria/integration
          go test -race -c -o "$fixture/bootstrap.test" ./internal/bootstrap
          sudo unshare --net bash -euc '
            ip link set lo up
            runuser -u "$1" -- env NODE_TEST_HYSTERIA="$2/hysteria" "$2/engine.test" -test.v -test.count=1
            runuser -u "$1" -- env NODE_TEST_HYSTERIA="$2/hysteria" "$2/bootstrap.test" -test.v -test.count=1 -test.run "^TestHysteria"
          ' bash "$(id -un)" "$fixture"
      - run: bash scripts/ci/check.sh
      - name: Check OpenVPN with a real client in an isolated network
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openvpn iproute2 iputils-ping openssl
          test -c /dev/net/tun || sudo modprobe tun
          fixture=$(mktemp -d "$RUNNER_TEMP/node-openvpn.XXXXXX")
          # The distro's service profile does not cover the fixture's temporary paths.
          install -m 0755 /usr/sbin/openvpn "$fixture/openvpn"
          go test -race -c -o "$fixture/openvpn.test" ./internal/engines/openvpn/instances/integration
          sudo unshare --net -- env NODE_TEST_OPENVPN="$fixture/openvpn" \
            NODE_TEST_OPENVPN_PARENT_NETNS="$(readlink /proc/self/ns/net)" \
            "$fixture/openvpn.test" -test.v -test.count=1 -test.timeout=90s
      - id: package
        run: bash scripts/ci/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}*
          if-no-files-found: error
