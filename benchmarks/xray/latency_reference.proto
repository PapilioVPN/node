syntax = "proto3";

package benchmark.xray;
option go_package = "github.com/PapilioVPN/node/benchmarks/xray;main";

// Wire projection of PasarGuard Node 739eab9 common/service.proto.
message ReferenceLatencyRequest {
  string name = 1;
}

message ReferenceLatencyResponse {
  repeated ReferenceLatency latencies = 1;
}

message ReferenceLatency {
  string name = 1;
  bool alive = 2;
  int64 delay = 3;
  string link = 4;
  int64 last_seen_time = 5;
  int64 last_try_time = 6;
  string source = 7;
}
